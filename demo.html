/* ── Aisle routing — direction-aware, two-sided zone access ────────────
   Each zone has TWO aisles: topY (above zone) and bottomY (below zone).
   Row 0 zones:  topY=null,        bottomY=H_AISLE[0]
   Row 1 zones:  topY=H_AISLE[0],  bottomY=H_AISLE[1]
   Row 2 zones:  topY=H_AISLE[1],  bottomY=H_AISLE[2]

   Routing rule:
   • Going UP  (smaller y) → exit via topY,    enter via bottomY
   • Going DOWN(larger y)  → exit via bottomY, enter via topY
   • Same row              → both use bottomY (same corridor)
   • Adjacent rows share an aisle → NO vertical corridor needed!
   • Non-adjacent rows use left-wall (x=2) as vertical passage.

   Result: path walks THROUGH zones (in one end, out the other),
   never backtracks, never cuts through shelves.              ── */
const EXIT_POS = { x: POS_X-6, y: 44 };

const getNodePos = id => {
  if (id === 'entrance') return {cx:ENTRANCE.x,cy:ENTRANCE.y,topY:H_AISLE[3],bottomY:null,     row:3};
  if (id === 'exit')     return {cx:EXIT_POS.x, cy:EXIT_POS.y, topY:null,      bottomY:H_AISLE[0],row:-1};
  const z = ZONES[id];
  return {
    cx:z.cx, cy:z.cy, row:z.row,
    topY:    z.row===0 ? null : H_AISLE[z.row-1],
    bottomY: H_AISLE[z.row],
  };
};

const VCORR = 2; // left-wall vertical passage (clear of ALL zone blocks)

const aisleRoute = (fromId, toId) => {
  const f = getNodePos(fromId);
  const t = getNodePos(toId);
  const pts = [[f.cx, f.cy]];
  const sameRow = f.row === t.row;
  const goingUp = !sameRow && t.cy < f.cy; // toward row 0

  // ── Choose which aisle to exit/enter ──
  // Source: exit from top if going up (walk THROUGH the zone upward), else exit from bottom
  const f_exit = (goingUp && f.topY !== null) ? f.topY
               : (f.bottomY !== null ? f.bottomY : f.topY);
  // Target: enter from bottom if going up (arrive from below), else enter from top
  const t_entry = sameRow ? t.bottomY
                : (goingUp && t.bottomY !== null) ? t.bottomY
                : (t.topY !== null ? t.topY : t.bottomY);

  // ── Step 1: exit source zone (walk from center to exit aisle) ──
  if (f.cy !== f_exit) pts.push([f.cx, f_exit]);

  // ── Step 2: travel to target entry aisle ──
  if (f_exit === t_entry) {
    // Same corridor (adjacent rows share an aisle) — walk straight across
    if (f.cx !== t.cx) pts.push([t.cx, f_exit]);
  } else {
    // Non-adjacent: use left-wall vertical corridor
    const cur = pts[pts.length-1];
    if (cur[0] !== VCORR) pts.push([VCORR, f_exit]);
    pts.push([VCORR, t_entry]);
    if (VCORR !== t.cx) pts.push([t.cx, t_entry]);
  }

  // ── Step 3: enter target zone (walk from aisle to center) ──
  const last = pts[pts.length-1];
  if (last[0] !== t.cx || last[1] !== t.cy) pts.push([t.cx, t.cy]);
  return pts;
};

/* Accurate Manhattan distance using the same direction-aware routing */
const aisleDistance = (a, b) => {
  const f = getNodePos(a), t = getNodePos(b);
  const sameRow = f.row === t.row;
  const goingUp = !sameRow && t.cy < f.cy;
  const f_exit  = (goingUp && f.topY!==null) ? f.topY : (f.bottomY!==null ? f.bottomY : f.topY);
  const t_entry = sameRow ? t.bottomY : (goingUp && t.bottomY!==null) ? t.bottomY : (t.topY!==null ? t.topY : t.bottomY);
  let d = Math.abs(f.cy - f_exit);                          // exit zone
  if (f_exit === t_entry) d += Math.abs(t.cx - f.cx);       // same corridor: horizontal walk
  else d += Math.abs(f.cx - VCORR) + Math.abs(f_exit - t_entry) + Math.abs(t.cx - VCORR); // via left wall
  d += Math.abs(t.cy - t_entry);                            // enter zone
  return d;
};

/* Nearest-neighbor TSP from entrance */
const nearestNeighbor = zoneIds => {
  const rem=[...zoneIds]; const route=[]; let cur='entrance';
  while(rem.length){
    let best=null,bd=Infinity;
    rem.forEach(id=>{const d=aisleDistance(cur,id);if(d<bd){bd=d;best=id;}});
    route.push(best); rem.splice(rem.indexOf(best),1); cur=best;
  }
  return route;
};

const LABELS='ABCDEFGHIJK';

const buildWaypoints = selectedIds => {
  const byZone={};
  CATALOG.filter(p=>selectedIds.has(p.id)).forEach(p=>{
    (byZone[p.zone]=byZone[p.zone]||[]).push(p);
  });
  const zids=Object.keys(byZone);
  if(!zids.length) return [];
  const ordered=nearestNeighbor(zids);
  return ordered.map((zid,i)=>{
    const prev=i===0?'entrance':ordered[i-1];
    return {
      label:LABELS[i], zone:zid,
      zoneName:ZONES[zid].name,
      items:byZone[zid],
      cx:ZONES[zid].cx, cy:ZONES[zid].cy,
      x:ZONES[zid].cx,  y:ZONES[zid].cy,
      dist:Math.round(aisleDistance(prev,zid)*0.22),
      monster:ZONE_MONSTERS[zid]||null,
    };
  });
};

      ))}
      {/* Main corridor below all zones */}
      <rect x={2} y={H_AISLE[2]+2} width={SVG_W-4} height={16} fill="#071d0a" opacity="0.95"/>
      {/* Main corridor extended (before entrance) */}
      <rect x={2} y={H_AISLE[3]-4} width={SVG_W-4} height={12} fill="#061408" opacity="0.9"/>

      {/* ── HOT OFFER promo area in row1 right side ── */}
      <rect x={162} y={96} width={94} height={52} rx="4"
        fill="#1a0800" stroke="#92400e" strokeWidth="1" strokeDasharray="3,2" opacity="0.8"/>
      <text x={209} y={118} textAnchor="middle" fontSize="9" fill="#f59e0b" fontWeight="700">🔥 HOT OFFER</text>
      <text x={209} y={131} textAnchor="middle" fontSize="7" fill="#d97706">โปรโมชั่นพิเศษ</text>
      <text x={209} y={142} textAnchor="middle" fontSize="8" fill="#fcd34d">ลด 10–50%</text>

      {/* ── TROLLEY BAY corners ── */}
      <rect x={2} y={H_AISLE[2]+20} width={52} height={32} rx="3"
        fill="#071508" stroke="#1a4025" strokeWidth="1" opacity="0.9"/>
      <text x={28} y={H_AISLE[2]+32} textAnchor="middle" fontSize="7" fill="#2d5a35" fontWeight="600">TROLLEY</text>
      <text x={28} y={H_AISLE[2]+42} textAnchor="middle" fontSize="7" fill="#2d5a35">BAY 🛒</text>
      <rect x={198} y={H_AISLE[2]+20} width={52} height={32} rx="3"
        fill="#071508" stroke="#1a4025" strokeWidth="1" opacity="0.9"/>
      <text x={224} y={H_AISLE[2]+32} textAnchor="middle" fontSize="7" fill="#2d5a35" fontWeight="600">TROLLEY</text>
      <text x={224} y={H_AISLE[2]+42} textAnchor="middle" fontSize="7" fill="#2d5a35">BAY 🛒</text>

      {/* ── POS / CHECKOUT — full right strip ── */}
      <rect x={POS_X} y={2} width={posW} height={SVG_H-40} rx="5"
        fill="#0a1a0d" stroke="#1a4025" strokeWidth="1.5" strokeDasharray="4,3"/>
      <text x={posMid} y={26} textAnchor="middle" fontSize="18">🏪</text>
      <text x={posMid} y={40} textAnchor="middle" fill="#4ade80" fontSize="7" fontWeight="700">POS</text>
      {/* checkout lane lines */}
      {[52,68,84,100,116,132,148,164,180,196,212,228].map((y,i)=>(
        <line key={i} x1={POS_X+3} y1={y} x2={SVG_W-6} y2={y}
          stroke="#1e4025" strokeWidth="0.8" opacity="0.7"/>
      ))}
      {/* exit arrow */}
      <text x={posMid} y={SVG_H-44} textAnchor="middle" fontSize="12" fill="#4ade80">→</text>
      <text x={posMid} y={SVG_H-34} textAnchor="middle" fontSize="6" fill="#2d5a35">EXIT</text>

      {/* ── ZONE BLOCKS ── */}
      {Object.values(ZONES).map(z=>{
        const wpIdx = zoneWpIdx[z.id];
        const inRoute = wpIdx !== undefined;
        const done = inRoute && collected.includes(wpIdx);
        const active = wpIdx === stepIdx;
        const isDairy = z.id === 'fresh'; // thin DAIRY strip — special rendering
        return (
          <g key={z.id}>
            <rect x={z.rx} y={z.ry} width={z.rw} height={z.rh} rx={isDairy?3:5}
              fill={z.bg} stroke={active?'#ffd700':done?'#10b981':z.bd}
              strokeWidth={active||done?2:1.5}
              opacity={inRoute?1:0.75}/>
            {/* shelf lines — horizontal for normal zones, skip for dairy strip */}
            {!isDairy && [0.34,0.67].map((r,si)=>(
              <line key={si} x1={z.rx+4} y1={z.ry+z.rh*r} x2={z.rx+z.rw-4} y2={z.ry+z.rh*r}
                stroke={z.bd} strokeWidth="0.7" opacity="0.4"/>
            ))}

            {isDairy ? (
              /* DAIRY strip: rotated label */
              <>
                <text x={z.cx} y={z.ry+26} textAnchor="middle" fontSize="10">{z.icon}</text>
                <g transform={`rotate(-90,${z.cx},${z.ry+z.rh/2})`}>
                  <text x={z.cx} y={z.ry+z.rh/2+3} textAnchor="middle"
                    fill={z.tc} fontSize="6" fontWeight="700">{z.name}</text>
                </g>
              </>
            ) : (
              /* Normal zone rendering */
              <>
                <text x={z.cx} y={z.ry+21} textAnchor="middle" fontSize="13">{z.icon}</text>
                <text x={z.cx} y={z.ry+34} textAnchor="middle" fill={z.tc}
                  fontSize={z.rw<44?'6.5':'7.5'} fontWeight="600"
                  style={{wordBreak:'break-all'}}>{z.name}</text>
                {/* item count pill */}
                {inRoute && !done && (
                  <>
                    <rect x={z.cx-11} y={z.ry+39} width="22" height="11" rx="5"
                      fill={active?'#007934':'rgba(255,255,255,.1)'}/>
                    <text x={z.cx} y={z.ry+47} textAnchor="middle" fill="white" fontSize="7" fontWeight="700">
                      {waypoints[wpIdx].items.length}ชิ้น
                    </text>
                  </>
                )}
                {done && (
                  <text x={z.cx} y={z.ry+48} textAnchor="middle" fill="#4ade80" fontSize="9">✓</text>
                )}
              </>
            )}

            {/* waypoint label badge (top-left corner) */}
            {inRoute && (
              <g>
                <circle cx={z.rx+(isDairy?z.rw/2:7)} cy={z.ry+7} r="7"
                  fill={done?'#059669':active?'#007934':'#1a4025'}
                  stroke={done?'#4ade80':active?'#ffd700':'#1e4025'}
                  strokeWidth="1"/>
                <text x={z.rx+(isDairy?z.rw/2:7)} y={z.ry+11} textAnchor="middle" fill="white"
                  fontSize="7" fontWeight="900">{waypoints[wpIdx].label}</text>
              </g>
            )}
            {/* monster glow badge (top-right, skip for dairy) */}
            {!isDairy && inRoute && !done && ZONE_MONSTERS[z.id] && (
              <>
                <circle cx={z.rx+z.rw-8} cy={z.ry+8} r="10" fill="rgba(255,215,0,.08)">
                  <animate attributeName="r" values="7;14;7" dur="2s" repeatCount="indefinite"/>
                  <animate attributeName="opacity" values=".5;.1;.5" dur="2s" repeatCount="indefinite"/>
                </circle>
                <circle cx={z.rx+z.rw-8} cy={z.ry+8} r="6.5" fill="rgba(255,210,0,.85)"
                  stroke="#ffd700" strokeWidth="1.5">
                  <animate attributeName="r" values="5;7;5" dur="1.5s" repeatCount="indefinite"/>
                </circle>
                <text x={z.rx+z.rw-8} y={z.ry+12} textAnchor="middle" fontSize="8">
                  {ZONE_MONSTERS[z.id].emoji}
                </text>
              </>
            )}
            {/* active pulse ring */}
            {active && (
              <rect x={z.rx-2} y={z.ry-2} width={z.rw+4} height={z.rh+4} rx="7"
                fill="none" stroke="#ffd700" strokeWidth="2" opacity="0.7">
                <animate attributeName="opacity" values=".7;.2;.7" dur="1.2s" repeatCount="indefinite"/>
              </rect>
            )}
          </g>
        );
      })}

      {/* ── ROUTE SEGMENTS ── */}
      {segments.map((seg,i)=>{
        const done = stepIdx >= i;
        return (
          <polyline key={i}
            points={seg.map(p=>p.join(',')).join(' ')}
            fill="none" stroke="#ffd700"
            strokeWidth={done?2.8:1.4}
            strokeLinecap="round" strokeLinejoin="round"
            strokeDasharray={done?'none':'6,5'}
            opacity={done?0.85:0.18}
            className={done?'ani-route':undefined}
          />
        );
      })}

      {/* ── ENTRANCE / EXIT bar ── */}
      <rect x={58} y={H_AISLE[3]+8} width={140} height={18} rx="6"
        fill="rgba(5,150,105,.18)" stroke="#059669" strokeWidth="1"/>
      <text x={128} y={H_AISLE[3]+20} textAnchor="middle" fill="#4ade80"
        fontSize="8" fontWeight="700">⬆ ทางเข้า / ออก</text>
      <line x1={ENTRANCE.x} y1={H_AISLE[3]+26} x2={ENTRANCE.x} y2={ENTRANCE.y-5}
        stroke="#059669" strokeWidth="1.5" strokeDasharray="3,2" opacity="0.5"/>

      {/* ── USER DOT ── */}
      <g style={{
        transform:`translate(${userPos.x}px,${userPos.y}px)`,
        transition:'transform 0.32s linear'
      }}>
        <circle r="10" fill="#007934" stroke="white" strokeWidth="2"/>
        <text y="4" textAnchor="middle" fontSize="10">🧑</text>
      </g>

      <text x={SVG_W-4} y={SVG_H-2} textAnchor="end" fill="#4a7c54" fontSize="7">
        RouteDee Smart Route™
      </text>
    </svg>
  );
};

/* ══════════════════════════════════════════════════════
   PRODUCT PICKER
══════════════════════════════════════════════════════ */
const ZONE_NAMES={veg:'ผักผลไม้',fresh:'ของสด/นม',meat:'เนื้อสัตว์',grain:'ข้าว/แป้ง',
  spice:'เครื่องปรุง',sweet:'ของหวาน',drink:'เครื่องดื่ม',coffee:'กาแฟ/ชา',
  clean:'ของใช้',beauty:'เครื่องสำอาง',bakery:'เบเกอรี่'};

const ProductPicker=({selected,onToggle,onStart})=>{
  const [q,setQ]=useState('');
  const [cat,setCat]=useState('ทั้งหมด');
  const cats=['ทั้งหมด',...Object.keys(ZONE_DEFS)];
  const filtered=useMemo(()=>CATALOG.filter(p=>{
    const mc=cat==='ทั้งหมด'||p.zone===cat;
    const mq=p.name.includes(q)||ZONE_NAMES[p.zone].includes(q);
    return mc&&mq;
  }),[q,cat]);
  const n=selected.size;

  return (
    <div className="h-full flex flex-col" style={{background:"#071209"}}>
      <div className="px-3 pt-3 pb-2 shrink-0">
        <div className="flex items-center justify-between mb-2">
          <h2 className="text-white font-bold text-sm">🛒 เลือกสินค้า</h2>
          {n>0&&<span className="text-xs font-bold px-2 py-0.5 rounded-full text-white"
            style={{background:'linear-gradient(135deg,#059669,#007934)'}}>เลือกแล้ว {n} ชิ้น</span>}
        </div>
        {/* search */}
        <div className="relative mb-2">
          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-xs">🔍</span>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="ค้นหาสินค้า..."
            className="w-full pl-7 pr-8 py-1.5 rounded-xl text-xs text-white placeholder-gray-600
              border border-green-900 outline-none focus:border-yellow-500"
            style={{background:'#0e1f11'}}/>
          {q&&<button onClick={()=>setQ('')}
            className="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-500 text-xs">✕</button>}
        </div>
        {/* category tabs */}
        <div className="flex gap-1 overflow-x-auto pb-0.5" style={{scrollbarWidth:'none'}}>
          {cats.map(c=>(
            <button key={c} onClick={()=>setCat(c)}
              className="shrink-0 px-2 py-0.5 rounded-lg text-xs font-semibold transition-all"
              style={{
                background:cat===c?'linear-gradient(135deg,#007934,#6d28d9)':'rgba(255,255,255,.05)',
                color:cat===c?'white':'#64748b',
                border:cat===c?'none':'1px solid #1e3a5f',
              }}>
              {c==='ทั้งหมด'?'ทั้งหมด':(ZONE_DEFS[c]?.icon||'')+' '+ZONE_NAMES[c]}
            </button>
          ))}
        </div>
      </div>

      <div className="flex-1 overflow-y-auto px-3 pb-2">
        {filtered.length===0
          ? <div className="text-center py-10 text-gray-600 text-xs">ไม่พบสินค้า</div>
          : (
            <div className="grid grid-cols-2 gap-1.5">
              {filtered.map(p=>{
                const on=selected.has(p.id);
                return (
                  <button key={p.id} onClick={()=>onToggle(p.id)}
                    className="rounded-xl p-2 text-left transition-all"
                    style={{
                      background:on?'linear-gradient(135deg,rgba(5,150,105,.25),rgba(8,145,178,.2))':'rgba(255,255,255,.04)',
                      border:on?'1.5px solid #10b981':'1.5px solid #1e3a5f',
                    }}>
                    <div className="flex items-start justify-between">
                      <span className="text-xl leading-none">{p.emoji}</span>
                      <div className={`w-4 h-4 rounded-full flex items-center justify-center text-xs
                        transition-all ${on?'bg-emerald-500':'border border-slate-600'}`}>
                        {on&&'✓'}
                      </div>
                    </div>
                    <div className="text-white text-xs font-semibold mt-1 leading-tight">{p.name}</div>
                    <div className="text-gray-600 text-xs">{ZONE_NAMES[p.zone]}</div>
                  </button>
                );
              })}
            </div>
          )
        }
      </div>

      <div className="shrink-0 px-3 pb-3 pt-2 border-t border-green-900/60"
        style={{background:'rgba(8,12,26,.95)'}}>
        {n>0&&(
          <div className="flex flex-wrap gap-1 mb-2">
            {[...selected].slice(0,12).map(id=>{
              const p=CATALOG.find(x=>x.id===id);
              return (
                <span key={id} className="inline-flex items-center gap-0.5 text-xs px-1.5 py-0.5
                  rounded-full border border-emerald-700 ani-tag-in"
                  style={{background:'rgba(5,150,105,.15)',color:'#6ee7b7'}}>
                  {p.emoji}
                  <button onClick={()=>onToggle(id)} className="text-emerald-700 text-xs ml-0.5">✕</button>
                </span>
              );
            })}
            {n>12&&<span className="text-gray-500 text-xs self-center">+{n-12}</span>}
          </div>
        )}
        <button onClick={n>0?onStart:undefined} disabled={n===0}
          className="w-full py-3 rounded-2xl font-bold text-sm transition-all"
          style={{
            background:n>0?'linear-gradient(135deg,#059669,#007934)':'#132b16',
            color:n>0?'white':'#475569',
            boxShadow:n>0?'0 4px 18px rgba(5,150,105,.35)':'none',
          }}>
          {n===0?'เลือกสินค้าก่อนเริ่มช้อป':`🗺️ คำนวณเส้นทางสั้นสุด · ${n} ชิ้น`}
        </button>
      </div>
    </div>
  );
};

/* ══════════════════════════════════════════════════════
   WALKING NAVIGATOR
══════════════════════════════════════════════════════ */
const WalkNavigator=({waypoints,stepIdx,moving,collected,coupons,userPos,onWalk,onMonster,onFinish,onBack})=>{
  const wp=stepIdx>=0&&stepIdx<waypoints.length?waypoints[stepIdx]:null;
  const hasMonster=wp&&wp.monster&&!coupons.find(c=>c.id===wp.monster.id);
  const allDone=collected.length===waypoints.length;
  const totalDist=waypoints.slice(0,Math.max(0,stepIdx+1)).reduce((a,w)=>a+w.dist,0);

  return (
    <div className="h-full overflow-y-auto p-2.5" style={{background:"#071209"}}>
      <div className="flex items-center justify-between mb-1.5">
        <button onClick={onBack} className="text-green-600 text-xs underline">← แก้รายการ</button>
        <div className="flex items-center gap-2">
          <span className="text-xs text-yellow-400 font-semibold">{collected.length}/{waypoints.length} จุด</span>
          {totalDist>0&&<span className="text-xs text-gray-500">{totalDist}m</span>}
        </div>
      </div>

      {/* step trail */}
      <div className="flex items-center gap-0.5 mb-2 overflow-x-auto" style={{scrollbarWidth:'none'}}>
        <div className="text-gray-700 text-xs shrink-0 font-mono">IN</div>
        {waypoints.map((w,i)=>(
          <React.Fragment key={i}>
            <div className="h-px flex-1 min-w-2 transition-all"
              style={{background:collected.includes(i)?'#ffd700':'#1a4025',minWidth:8}}/>
            <div className={`w-6 h-6 rounded-full shrink-0 flex items-center justify-center
              text-xs font-bold border transition-all
              ${collected.includes(i)?'border-emerald-400 bg-emerald-900/60 text-emerald-300':
                i===stepIdx+1&&!moving?'border-yellow-500 bg-yellow-900/20 text-yellow-300':
                'border-green-900 text-green-600'}`}>
              {collected.includes(i)?'✓':w.label}
            </div>
          </React.Fragment>
        ))}
        <div className="h-px flex-1 min-w-2" style={{background:'#1a4025',minWidth:8}}/>
        <div className="text-gray-700 text-xs shrink-0 font-mono">OUT</div>
      </div>

      {/* MAP */}
      <div style={{marginLeft:'-2px',marginRight:'-2px'}}>
        <StoreMap waypoints={waypoints} stepIdx={stepIdx} userPos={userPos} collected={collected}/>
      </div>

      <div className="mt-2 space-y-1.5">
        {/* smart route badge (first time) */}
        {stepIdx===-1&&!moving&&(
          <div className="rounded-xl px-3 py-2 border border-yellow-600/40 text-center"
            style={{background:'rgba(0,121,52,.12)'}}>
            <div className="text-yellow-300 text-xs font-semibold">
              🧠 Smart Route คำนวณเส้นทางสั้นสุดแล้ว!
            </div>
            <div className="text-gray-500 text-xs mt-0.5">
              {waypoints.length} จุด · ระยะรวม ~{waypoints.reduce((a,w)=>a+w.dist,0)}m
            </div>
          </div>
        )}

        {/* walk button */}
        {stepIdx===-1&&!moving&&(
          <button onClick={onWalk}
            className="w-full py-3 rounded-2xl font-bold text-white text-sm"
            style={{background:'linear-gradient(135deg,#059669,#007934)',boxShadow:'0 4px 16px rgba(5,150,105,.35)'}}>
            🚶 เริ่มเดินช้อป!
          </button>
        )}

        {moving&&(
          <div className="rounded-xl p-2.5 border border-yellow-600/50 text-center"
            style={{background:'rgba(0,121,52,.12)'}}>
            <div className="text-yellow-300 font-bold text-xs">
              {stepIdx>=waypoints.length-1&&collected.length===waypoints.length
                ? '🛒 กำลังเดินไปชำระเงิน (POS)…'
                : `🚶 กำลังเดินไปยัง Zone ${waypoints[stepIdx+1]?.label} — ${waypoints[stepIdx+1]?.zoneName}…`}
            </div>
          </div>
        )}

        {/* arrived at POS / checkout */}
        {!moving&&allDone&&stepIdx>=waypoints.length&&(
          <div className="space-y-1.5 ani-bounce-in">
            <div className="rounded-xl p-3 border border-yellow-500/50 text-center"
              style={{background:'linear-gradient(135deg,rgba(16,185,129,.15),rgba(0,121,52,.2))'}}>
              <div className="text-2xl mb-1">🏪</div>
              <div className="text-yellow-300 font-bold text-sm">ถึงแคชเชียร์แล้ว!</div>
              <div className="text-gray-400 text-xs mt-0.5">รวบรวมสินค้าครบทุกชิ้น</div>
            </div>
            <button onClick={onFinish}
              className="w-full py-3 rounded-2xl font-black text-white text-base"
              style={{background:'linear-gradient(135deg,#f59e0b,#ef4444)',boxShadow:'0 4px 18px rgba(245,158,11,.5)'}}>
              🏁 ชำระเงินแล้ว! ดูสรุป
            </button>
          </div>
        )}

        {!moving&&wp&&(
          <div className="space-y-1.5 ani-bounce-in">
            <div className="rounded-xl p-2.5 border border-emerald-600/40"
              style={{background:'linear-gradient(135deg,rgba(5,78,22,.45),rgba(3,52,44,.45))'}}>
              <div className="text-emerald-300 text-xs font-semibold">✅ Zone {wp.zone} — {wp.zoneName}</div>
              <div className="text-white font-bold text-sm mt-0.5">
                {wp.items.map(p=>`${p.emoji} ${p.name}`).join('  ·  ')}
              </div>
              {wp.items.length>1&&(
                <div className="text-emerald-400 text-xs mt-0.5">เก็บได้ทีเดียว {wp.items.length} ชิ้น!</div>
              )}
            </div>

            {hasMonster&&(
              <button onClick={onMonster}
                className="w-full py-2.5 rounded-xl font-bold text-white text-xs"
                style={{
                  background:'linear-gradient(135deg,#007934,#ffc300)',
                  boxShadow:'0 0 16px rgba(109,40,217,.4)',
                  animation:'float 2s ease-in-out infinite',
                }}>
                ⚡ {wp.monster.rarity}! {wp.monster.emoji} ปีศาจโผล่ — แตะเพื่อจับ!
              </button>
            )}

            {!allDone?(
              <button onClick={onWalk}
                className="w-full py-2.5 rounded-2xl font-bold text-white text-sm"
                style={{background:'linear-gradient(135deg,#007934,#00843d)'}}>
                🚶 เดินต่อ → {waypoints[stepIdx+1]?.label} {waypoints[stepIdx+1]?.zoneName}
              </button>
            ):stepIdx<waypoints.length?(
              <button onClick={onWalk}
                className="w-full py-3 rounded-2xl font-black text-white text-base"
                style={{background:'linear-gradient(135deg,#059669,#007934)',boxShadow:'0 4px 18px rgba(5,150,105,.4)',animation:'float 1.8s ease-in-out infinite'}}>
                🛒 เก็บครบแล้ว! เดินไปชำระเงิน →
              </button>
            ):(
              <button onClick={onFinish}
                className="w-full py-3 rounded-2xl font-black text-white text-base"
                style={{background:'linear-gradient(135deg,#f59e0b,#ef4444)',boxShadow:'0 4px 18px rgba(245,158,11,.5)'}}>
                🏁 ชำระเงินแล้ว! ดูสรุป
              </button>
            )}
          </div>
        )}

        {/* mini stats */}
        <div className="flex gap-1.5">
          {[
            {icon:'👟',v:Math.round(totalDist*1.35),u:'ก้าว'},
            {icon:'📏',v:totalDist,u:'เมตร'},
            {icon:'🔥',v:Math.round(totalDist*0.058),u:'kcal'},
          ].map((s,i)=>(
            <div key={i} className="flex-1 rounded-xl p-1.5 text-center border border-green-900/60"
              style={{background:'rgba(255,255,255,.03)'}}>
              <div className="text-sm">{s.icon}</div>
              <div className="text-white font-bold text-xs">{s.v}</div>
              <div className="text-gray-600 text-xs">{s.u}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

/* ══════════════════════════════════════════════════════
   MONSTER CATCH
══════════════════════════════════════════════════════ */
const MonsterCatch=({monster,lives,onCaught,onEscape,onLiveLost})=>{
  const [phase,setPhase]=useState('encounter');
  const [attempts,setAttempts]=useState(0);
  const handleThrow=()=>{
    setPhase('throwing');
    setTimeout(()=>{
      const ok=Math.random()>0.45;
      setPhase(ok?'success':'fail');
      if(ok) setTimeout(()=>onCaught(monster),600);
      else { setAttempts(a=>a+1); onLiveLost(); }
    },1100);
  };
  return (
    <div className="h-full flex flex-col items-center justify-center p-5"
      style={{background:'linear-gradient(160deg,#051a09,#093018)'}}>
      {phase!=='success'&&(
        <div className="w-full flex justify-between items-center mb-3">
          <div className="text-xs text-gray-500">ครั้งที่ {attempts+1}</div>
          <div className="text-sm leading-none">{'❤️'.repeat(lives)}{'🖤'.repeat(5-lives)}</div>
        </div>
      )}
      {phase!=='success'&&(
        <>
          <div className="text-yellow-400 text-xs font-bold rounded-full px-3 py-1.5 mb-3
            border border-yellow-500/50" style={{background:'rgba(120,60,0,.2)'}}>
            ⚡ พบปีศาจ {monster.rarity}!
          </div>
          <div className="text-8xl mb-2 ani-float"
            style={{filter:'drop-shadow(0 0 28px rgba(180,80,255,.85))'}}>
            {phase==='fail'?'💨':monster.emoji}
          </div>
          <div className="font-bold text-sm mb-3" style={{color:monster.rc}}>⭐ {monster.rarity}</div>
          <div className="w-full rounded-2xl p-3 text-center mb-4 border border-purple-500/40"
            style={{background:'rgba(46,16,101,.55)'}}>
            <div className="text-white font-bold text-sm">{monster.brand}</div>
            <div className="font-black text-3xl text-green-400">ลด ฿{monster.discount}</div>
          </div>
        </>
      )}
      {phase==='encounter'&&(
        <>
          <button onClick={handleThrow}
            className="w-full py-4 rounded-2xl font-black text-white text-xl mb-2"
            style={{background:'linear-gradient(135deg,#007934,#ffc300)',boxShadow:'0 4px 24px rgba(124,58,237,.5)'}}>
            🎯 ขว้าง!
          </button>
          <button onClick={onEscape} className="text-slate-500 text-xs underline">หนีกลับ</button>
        </>
      )}
      {phase==='throwing'&&(
        <div className="w-full py-4 rounded-2xl text-center text-white font-bold text-lg ani-shake"
          style={{background:'#4b5563'}}>⚡ กำลังขว้าง…</div>
      )}
      {phase==='fail'&&(
        <div className="w-full ani-bounce-in space-y-2">
          <div className="text-red-400 font-bold text-center text-lg">หลุดมือ! 😤 ❤️−1</div>
          <button onClick={()=>setPhase('encounter')}
            className="w-full py-3 rounded-xl text-white font-bold"
            style={{background:'linear-gradient(135deg,#007934,#ffc300)'}}>
            🎯 ลองอีกครั้ง!
          </button>
          <button onClick={onEscape}
            className="w-full py-2.5 rounded-xl text-red-300 font-semibold text-sm border border-red-800"
            style={{background:'rgba(127,29,29,.3)'}}>
            🏃 หนีเลย
          </button>
        </div>
      )}
      {phase==='success'&&(
        <div className="text-center ani-bounce-in">
          <div className="text-7xl mb-2">🎉</div>
          <div className="text-green-400 font-black text-2xl mb-1">จับได้!</div>
          <div className="text-green-300 font-bold text-xl">฿{monster.discount} เข้ากระเป๋า!</div>
        </div>
      )}
    </div>
  );
};

const LineChart=({data,days})=>{
  const W=240,H=110,p={t:10,r:10,b:24,l:30};
  const iW=W-p.l-p.r,iH=H-p.t-p.b,max=Math.max(...data);
  const pts=data.map((v,i)=>({x:p.l+i*(iW/(data.length-1)),y:p.t+iH-(v/max)*iH}));
  const pp=pts.map(q=>`${q.x},${q.y}`).join(' ');
  const area=`${pts[0].x},${p.t+iH} ${pp} ${pts[pts.length-1].x},${p.t+iH}`;
  return (
    <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`}>
      <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stopColor="#10b981" stopOpacity=".4"/>
        <stop offset="100%" stopColor="#10b981" stopOpacity="0"/>
      </linearGradient></defs>
      {[0,.25,.5,.75,1].map((r,i)=><line key={i} x1={p.l} y1={p.t+iH*r} x2={p.l+iW} y2={p.t+iH*r} stroke="#1a4025" strokeWidth="1" strokeDasharray="3,3"/>)}
      {[0,.5,1].map((r,i)=><text key={i} x={p.l-4} y={p.t+iH*(1-r)+4} textAnchor="end" fill="#4a7c54" fontSize="9">{Math.round(max*r)}</text>)}
      <polygon points={area} fill="url(#lg)"/>
      <polyline points={pp} fill="none" stroke="#10b981" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
      {pts.map((q,i)=><circle key={i} cx={q.x} cy={q.y} r="4" fill="#10b981" stroke="#071d0a" strokeWidth="1.5"/>)}
      {days.map((d,i)=><text key={i} x={pts[i].x} y={H-6} textAnchor="middle" fill="#4a7c54" fontSize="9">{d}</text>)}
    </svg>
  );
};

        <h3 className="text-white font-bold text-sm mb-4">📊 Redemption Rate</h3>
        {[
          {label:'🎮 RouteDee AR',   pct:39.9,f:'#059669',t:'#007934',tc:'text-emerald-400',w:'80%'},
          {label:'📄 คูปองกระดาษ', pct:2.5, f:'#dc2626',t:'#b91c1c',tc:'text-red-400',    w:'5%'},
        ].map((b,i)=>(
          <div key={i} className="mb-3">

              <span className="text-slate-300 text-xs">{b.label}</span>
              <span className={`font-bold text-xs ${b.tc}`}>{b.pct}%</span>
            </div>

              <div className="h-full rounded-full flex items-center justify-end pr-2"
                style={{width:b.w,background:`linear-gradient(90deg,${b.f},${b.t})`}}>
                {b.pct>5&&<span className="text-white text-xs font-bold">{b.pct}%</span>}
              </div>
            </div>
          </div>
        ))}
        <div className="rounded-xl p-2.5 border border-emerald-600/50 mt-2"
          style={{background:'rgba(5,150,105,.12)'}}>
          <span className="text-emerald-300 font-bold text-sm">✨ RouteDee ดีกว่า <span className="text-xl font-black">16×</span>!</span>
        </div>
      </div>
      <div className="rounded-xl p-4 border border-green-900" style={{background:'#132b16'}}>
        <h3 className="text-white font-bold text-sm mb-3">📈 Daily Redemption</h3>
        <LineChart data={DAILY} days={DAYS}/>
      </div>
    </div>
    <div className="grid grid-cols-3 gap-4">
      <div className="rounded-xl p-4 border border-green-900" style={{background:'#132b16'}}>
        <h3 className="text-white font-bold text-sm mb-3">🔥 Traffic Heatmap</h3>
        {[
          {zone:'🧺 ของใช้',        pct:85,c:'#ef4444'},
          {zone:'🥬 ผักผลไม้',      pct:72,c:'#f97316'},
          {zone:'🥤 เครื่องดื่ม',   pct:60,c:'#eab308'},
          {zone:'🧴 เครื่องสำอาง',  pct:45,c:'#22c55e'},
          {zone:'🍞 เบเกอรี่',      pct:30,c:'#3b82f6'},
        ].map((z,i)=>(
          <div key={i} className="mb-2">
            <div className="flex justify-between mb-0.5">
              <span className="text-slate-300 text-xs">{z.zone}</span>
              <span className="text-slate-400 text-xs">{z.pct}%</span>
            </div>
            <div className="bg-slate-700 rounded-full h-2.5">
              <div className="h-full rounded-full" style={{width:`${z.pct}%`,background:z.c}}/>
            </div>
          </div>
        ))}
      </div>
      <div className="col-span-2 rounded-xl p-4 border border-green-900" style={{background:'#132b16'}}>
        <h3 className="text-white font-bold text-sm mb-3">💰 Revenue Streams</h3>
        <div className="grid grid-cols-2 gap-3">
          {[
            {icon:'🏪',label:'SaaS Subscription',desc:'รีเทลจ่ายรายปี',          value:'฿360,000/ปี',  b:'border-blue-500'},
            {icon:'🤝',label:'Brand Deal Margin', desc:'ส่วนต่างจากแบรนด์',       value:'฿24,900/camp', b:'border-purple-500'},
            {icon:'📊',label:'Data Analytics',    desc:'Heatmap + Customer Insight',value:'฿15,000/เดือน',b:'border-emerald-500'},
            {icon:'🚀',label:'Total Brand ROI',   desc:'Attack มี.ค.',            value:'4.2× Return',  b:'border-yellow-500'},
          ].map((r,i)=>(
            <div key={i} className={`border-l-4 ${r.b} rounded-r-xl p-3`}
              style={{background:'rgba(255,255,255,.04)'}}>

                <span className="text-lg">{r.icon}</span>

/* ══════════════════════════════════════════════════════
   MAIN APP
══════════════════════════════════════════════════════ */
const App=()=>{
  const [view,       setView]       = useState('customer');
  const [screen,     setScreen]     = useState('list');
  const [activeTab,  setActiveTab]  = useState('home');
  const [lives,      setLives]      = useState(5);
  const [selected,   setSelected]   = useState(new Set([6,11,16,31,41]));
  const [waypoints,  setWaypoints]  = useState([]);
  const [walkStep,   setWalkStep]   = useState(-1);
  const [moving,     setMoving]     = useState(false);
  const [collected,  setCollected]  = useState([]);
  const [userPos,    setUserPos]    = useState({x:ENTRANCE.x,y:ENTRANCE.y});
  const [activeMonster, setActiveMonster] = useState(null);
  const [coupons,    setCoupons]    = useState([]);
  const timerRef = useRef(null);

  const toggleProduct=id=>setSelected(prev=>{
    const n=new Set(prev); n.has(id)?n.delete(id):n.add(id); return n;
  });

  /* animate dot along path segments */
  const animatePath=useCallback((pts,onDone)=>{
    let i=1;
    const step=()=>{
      if(i<pts.length){
        setUserPos({x:pts[i][0],y:pts[i][1]});
        i++;
        timerRef.current=setTimeout(step,340);
      } else { setTimeout(onDone,180); }
    };
    step();
  },[]);

  const handleStartShopping=()=>{
    const wps=buildWaypoints(selected);
    setWaypoints(wps);
    setWalkStep(-1);
    setCollected([]);
    setMoving(false);
    setUserPos({x:ENTRANCE.x,y:ENTRANCE.y});
    setScreen('walking');
    setActiveTab('map');
  };

  const handleWalk=()=>{
    const next=walkStep+1;
    const isExitStep=next>=waypoints.length; // all zones done → walk to POS exit
    if(walkStep>=waypoints.length) return;   // already at exit, nothing to do
    setMoving(true);
    const fromId=walkStep<0?'entrance':waypoints[walkStep].zone;
    const toId=isExitStep?'exit':waypoints[next].zone;
    const pts=aisleRoute(fromId,toId);
    animatePath(pts,()=>{
      setMoving(false);
      if(isExitStep){
        setWalkStep(waypoints.length); // mark as arrived at POS
      } else {
        setWalkStep(next);
        setCollected(c=>c.includes(next)?c:[...c,next]);
      }
    });
  };

  const handleMonster=()=>{
    const wp=waypoints[walkStep];
    if(wp?.monster){ setActiveMonster(wp.monster); setScreen('catch'); }
  };

  const handleCaught=m=>{
    setCoupons(p=>[...p,{...m,uid:Date.now()}]);
    setActiveMonster(null);
    setTimeout(()=>setScreen('walking'),700);
  };

  const goTab=tab=>{
    setActiveTab(tab);
    if(tab==='home')   setScreen('list');
    if(tab==='map')    setScreen('walking');
    if(tab==='coupon') setScreen('wallet');
    if(tab==='rank')   setScreen('leaderboard');
  };

  return (
    <div className="min-h-screen flex flex-col items-center px-4 py-5" style={{background:'#050f07'}}>
      <div className="w-full max-w-5xl mb-4 text-center rounded-xl py-2 border border-green-900/60"
        style={{background:'#071d0a'}}>
        <span className="text-green-700 text-sm">🚀 Hackathon Demo — </span>
        <span className="text-yellow-400 font-bold text-sm">Retail AR Navigation · Smart Route</span>
        <span className="text-green-700 text-sm"> · RouteDee</span>
      </div>

      <div className="flex gap-2 mb-6 p-1 rounded-2xl border border-green-900/60" style={{background:'#071d0a'}}>
        {[
          {id:'customer',label:'📱 Customer App',  g:'from-green-700 to-green-600'},
          {id:'brand',   label:'📊 Brand Dashboard',g:'from-yellow-600 to-yellow-500'},
        ].map(v=>(
          <button key={v.id} onClick={()=>setView(v.id)}
            className={`px-6 py-2 rounded-xl font-semibold text-sm transition-all
              ${view===v.id?`bg-gradient-to-r ${v.g} text-white shadow-lg`:'text-green-600 hover:text-yellow-400'}`}>
            {v.label}
          </button>
        ))}
      </div>

      {view==='customer'&&(
        <div style={{width:360}}>
          <div className="rounded-[38px] border-4 border-green-900 shadow-2xl overflow-hidden flex flex-col"
            style={{background:'#071209',height:700}}>
            {/* status bar */}
            <div className="flex justify-between items-center px-5 py-2 bg-black/60 shrink-0">
              <span className="text-white text-xs font-semibold">9:41</span>
              <div className="text-sm leading-none">{'❤️'.repeat(lives)}{'🖤'.repeat(5-lives)}</div>
              <span className="text-white text-xs">📶 🔋</span>
            </div>
            {/* header */}
            <div className="shrink-0 flex items-center justify-between px-4 py-2"
              style={{background:'linear-gradient(135deg,#007934,#00a651)'}}>
              <div>
                <div className="text-white font-black text-base leading-none">🛒 RouteDee</div>
                <div className="text-green-100 text-xs mt-0.5">
                  {coupons.length} คูปอง · {collected.length}/{waypoints.length||selected.size} จุด
                </div>
              </div>
              <div className="text-right">
                <div className="text-yellow-300 text-xs font-bold">🧠 Smart Route™</div>
                <div className="text-green-100 text-xs">Nearest Neighbor TSP</div>
              </div>
            </div>

            <div className="flex-1 overflow-hidden">
              {screen==='list'&&(
                <ProductPicker selected={selected} onToggle={toggleProduct} onStart={handleStartShopping}/>
              )}
              {screen==='walking'&&(
                <WalkNavigator
                  waypoints={waypoints} stepIdx={walkStep} moving={moving}
                  collected={collected} coupons={coupons} userPos={userPos}
                  onWalk={handleWalk} onMonster={handleMonster}
                  onFinish={()=>setScreen('summary')}
                  onBack={()=>{setScreen('list');setActiveTab('home');}}
                />
              )}
              {screen==='catch'&&activeMonster&&(
                <MonsterCatch monster={activeMonster} lives={lives}
                  onCaught={handleCaught}
                  onEscape={()=>{setActiveMonster(null);setScreen('walking');}}
                  onLiveLost={()=>setLives(l=>Math.max(0,l-1))}
                />
              )}
              {screen==='summary'&&(
                <ShoppingSummary waypoints={waypoints} coupons={coupons}
                  onViewCoupons={()=>{setScreen('wallet');setActiveTab('coupon');}}
                  onLeaderboard={()=>{setScreen('leaderboard');setActiveTab('rank');}}
                />
              )}
              {screen==='wallet'&&(
                <CouponWallet coupons={coupons}
                  onGoHunt={()=>{setScreen('walking');setActiveTab('map');}}/>
              )}
              {screen==='leaderboard'&&<Leaderboard/>}
            </div>

            {/* bottom nav */}
            <div className="shrink-0 border-t border-green-900/60" style={{background:"#071209"}}>
              <div className="flex">
                {[
                  {id:'home',  icon:'🏠',label:'หน้าแรก'},
                  {id:'map',   icon:'🗺️',label:'แผนที่'},
                  {id:'coupon',icon:'🎫',label:'คูปอง',badge:coupons.length||null},
                  {id:'rank',  icon:'🏆',label:'อันดับ'},
                ].map(t=>(
                  <button key={t.id} onClick={()=>goTab(t.id)}
                    className={`flex-1 py-2.5 flex flex-col items-center relative transition-all
                      ${activeTab===t.id?'text-yellow-400':'text-green-600'}`}>
                    <span className="text-xl leading-none">{t.icon}</span>
                    <span className="text-xs mt-0.5">{t.label}</span>
                    {activeTab===t.id&&<div className="w-1.5 h-1.5 rounded-full bg-yellow-400 mt-0.5"/>}
                    {t.badge&&(
                      <span className="absolute top-1.5 right-3 text-xs bg-red-500 text-white
                        rounded-full w-4 h-4 flex items-center justify-center font-bold">
                        {t.badge}
                      </span>
                    )}
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}

      {view==='brand'&&<div className="w-full max-w-5xl"><BrandDashboard/></div>}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
