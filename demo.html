/* ══════════════════════════════════════════════════════
   ROUTING HELPERS
══════════════════════════════════════════════════════ */
const getRoutePoint = (id) => {
  if (id === 'entrance') return { cx: ENT.cx, cy: ENT.cy, aisle: HAISLE.main };
  const z = ZONE_DEFS[id];
  return { cx: z.cx, cy: z.cy, aisle: HAISLE[z.row] };
};

// Build L-shaped path through horizontal aisles
const aisleRoute = (fromId, toId) => {
  const f = getRoutePoint(fromId);
  const t = getRoutePoint(toId);
  const pts = [[f.cx, f.cy]];
  // Step out to horizontal aisle
  if (Math.abs(f.cy - f.aisle) > 2) pts.push([f.cx, f.aisle]);
  // Walk to main aisle if different row
  if (f.aisle !== t.aisle) {
    // go to right corridor if needed
    if (Math.abs(f.cx - t.cx) > 10) pts.push([t.cx, f.aisle]);
    pts.push([t.cx, t.aisle]);
  } else {
    // same aisle row, just walk horizontally
    if (Math.abs(f.cx - t.cx) > 2) pts.push([t.cx, f.aisle]);
  }
  // Step into zone
  if (Math.abs(t.cy - t.aisle) > 2) pts.push([t.cx, t.cy]);
  return pts;
};

// Manhattan distance through aisles
const aisleDist = (aId, bId) => {
  const a = getRoutePoint(aId), b = getRoutePoint(bId);
  const exitA = Math.abs(a.cy - a.aisle);
  const exitB = Math.abs(b.cy - b.aisle);
  const horiz = Math.abs(a.cx - b.cx);
  const vert  = a.aisle === b.aisle ? 0 : Math.abs(a.aisle - b.aisle);
  return exitA + horiz + vert + exitB;
};

// Nearest-neighbor TSP
const tspOrder = (zoneIds) => {
  if (!zoneIds.length) return [];
  const visited = new Set(), order = [];
  let cur = 'entrance';
  while (order.length < zoneIds.length) {
    let best = null, bestD = Infinity;
    for (const z of zoneIds) {
      if (visited.has(z)) continue;
      const d = aisleDist(cur, z);
      if (d < bestD) { bestD = d; best = z; }
    }
    visited.add(best); order.push(best); cur = best;
  }
  return order;
};

/* ══════════════════════════════════════════════════════
   MONSTER CATCH COMPONENT
══════════════════════════════════════════════════════ */
function MonsterCatch({ product, onSuccess, onFail, onLiveLost }) {
  const [phase, setPhase] = useState('idle'); // idle|throwing|success|fail
  const [missCount, setMissCount] = useState(0);
  const [throwPos, setThrowPos] = useState(null);

  const handleThrow = (e) => {
    if (phase !== 'idle') return;
    const rect = e.currentTarget.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top)  / rect.height) * 100;
    setThrowPos({x, y});
    setPhase('throwing');
    // Monster zone: 25-75% x, 15-55% y
    const hit = x > 25 && x < 75 && y > 15 && y < 55;
    setTimeout(() => {
      if (hit) {
        setPhase('success');
        setTimeout(() => onSuccess(), 900);
      } else {
        const nm = missCount + 1;
        setMissCount(nm);
        onLiveLost();
        if (nm >= 3) {
          setPhase('fail');
          setTimeout(() => onFail(), 900);
        } else {
          setPhase('idle');
          setThrowPos(null);
        }
      }
    }, 500);
  };

  return (
    <div className="flex flex-col items-center gap-3 select-none">
      <p className="text-yellow-300 text-sm font-semibold">แตะโยนใส่สินค้า!</p>
      <div
        onClick={handleThrow}
        className="relative w-56 h-52 rounded-2xl border-2 border-green-700 overflow-hidden cursor-crosshair"
        style={{background:'radial-gradient(ellipse at 50% 40%, #0a2e0a 60%, #020a02)'}}
      >
        {/* Product monster */}
        <div className="absolute inset-0 flex items-center justify-center pointer-events-none"
          style={{paddingBottom:'20%'}}>
          <div className={phase==='fail'?'ani-shake':phase==='success'?'ani-bounce-in':'ani-float'}>
            <div className="text-6xl">{product.icon || '📦'}</div>
          </div>
        </div>
        {/* Miss indicators */}
        <div className="absolute bottom-2 left-0 right-0 flex justify-center gap-1.5">
          {[0,1,2].map(i=>(
            <div key={i} className="w-3 h-3 rounded-full border border-red-500"
              style={{background: i < missCount ? '#ef4444' : 'transparent'}}/>
          ))}
        </div>
        {/* Throw animation */}
        {throwPos && phase === 'throwing' && (
          <div className="absolute pointer-events-none animate-ping"
            style={{left:`${throwPos.x}%`, top:`${throwPos.y}%`, transform:'translate(-50%,-50%)',
              width:24, height:24, borderRadius:'50%', background:'#ffd700', opacity:0.8}}/>
        )}
        {phase === 'success' && (
          <div className="absolute inset-0 flex items-center justify-center bg-green-900/70">
            <span className="text-4xl">✅</span>
          </div>
        )}
        {phase === 'fail' && (
          <div className="absolute inset-0 flex items-center justify-center bg-red-900/70">
            <span className="text-4xl">💨</span>
          </div>
        )}
      </div>
      <p className="text-gray-400 text-xs">ยังพลาดได้ {3 - missCount} ครั้ง</p>
    </div>
  );
}

function StoreMap({ waypoints, walkStep, userPos, moving, collected }) {

    waypoints.forEach(w => {
      const seg = aisleRoute(prev, w.zone);
      seg.forEach((p, i) => { if (i > 0 || pts.length === 0) pts.push(p); });
      prev = w.zone;
    });
    return pts.map(p => `${p[0]},${p[1]}`).join(' ');
  }, [waypoints]);

  return (
    <svg viewBox={`0 0 ${SVG_W} ${SVG_H}`} width="100%" style={{maxWidth:340, display:'block', margin:'0 auto'}}>
      {/* Background */}
      <rect width={SVG_W} height={SVG_H} fill="#0a1a0a" rx="8"/>

      {/* Horizontal aisle corridors */}
      <rect x={0} y={HAISLE[0]-6} width={SVG_W} height={12} fill="#0d1f0d" opacity={0.8}/>
      <rect x={0} y={HAISLE[1]-6} width={SVG_W} height={12} fill="#0d1f0d" opacity={0.8}/>
      <rect x={0} y={HAISLE[2]-6} width={SVG_W} height={12} fill="#0d1f0d" opacity={0.8}/>
      <rect x={0} y={HAISLE.main-6} width={SVG_W} height={12} fill="#0d1f0d" opacity={0.8}/>

      {/* POS / Checkout area - right side */}
      <rect x={272} y={84} width={34} height={96} fill="#0c1a12" stroke="#007934" strokeWidth={1} rx={2}/>
      <text x={289} y={128} textAnchor="middle" fontSize={7} fill="#4ade80" fontWeight="bold">POS</text>
      <text x={289} y={138} textAnchor="middle" fontSize={7} fill="#4ade80">แคชเชียร์</text>
      {/* POS lanes */}
      {[100,115,130,145,160].map((yy,i)=>(
        <rect key={i} x={274} y={yy} width={30} height={8} fill="#071a07" stroke="#166534" strokeWidth={0.5} rx={1}/>
      ))}

      {/* Trolley Bay - bottom left */}
      <rect x={4} y={296} width={60} height={38} fill="#071207" stroke="#166534" strokeWidth={1} rx={2}/>
      <text x={34} y={311} textAnchor="middle" fontSize={7} fill="#4ade80" fontWeight="bold">TROLLEY</text>
      <text x={34} y={321} textAnchor="middle" fontSize={7} fill="#4ade80">BAY</text>
      {/* Trolley icons */}
      {[12,26,40].map((xx,i)=>(
        <text key={i} x={xx} y={332} textAnchor="middle" fontSize={9} fill="#166534">🛒</text>
      ))}

      {/* Entrance area */}
      <rect x={68} y={296} width={198} height={50} fill="#071207" stroke="#007934" strokeWidth={1.5} rx={3}/>
      <text x={167} y={316} textAnchor="middle" fontSize={9} fill="#ffd700" fontWeight="bold">🚪 ทางเข้า / EXIT</text>
      <text x={167} y={330} textAnchor="middle" fontSize={7} fill="#4ade80">ENTRANCE</text>

      {/* Zone rectangles */}
      {Object.entries(ZONE_DEFS).map(([id, z]) => {
        const isActive = activeZones.has(id);
        const stepIdx  = waypoints.findIndex(w => w.zone === id);
        const isDone   = collected.includes(stepIdx);
        const isCurrent = stepIdx === walkStep;
        return (
          <g key={id}>
            <rect x={z.x} y={z.y} width={z.w} height={z.h}
              fill={z.bg} stroke={isDone ? '#ffd700' : isActive ? z.bd : '#1a2e1a'}
              strokeWidth={isDone ? 2 : isActive ? 1.5 : 1} rx={3}/>
            {/* Zone icon */}
            <text x={z.cx} y={z.cy - 8} textAnchor="middle" fontSize={id==='dairy'?8:14}>{z.icon}</text>
            {/* Zone name */}
            <text x={z.cx} y={z.cy + 8} textAnchor="middle"
              fontSize={id==='dairy'?5:7} fill={isActive ? z.tc : '#2d4a2d'} fontWeight="600">
              {id === 'dairy' ? z.name.replace('/','/ ') : z.name}
            </text>
            {/* Step number badge */}
            {isActive && !isDone && (
              <circle cx={z.x+z.w-7} cy={z.y+7} r={6} fill={isCurrent ? '#ffd700' : '#007934'}/>
            )}
            {isActive && !isDone && (
              <text x={z.x+z.w-7} y={z.y+10} textAnchor="middle" fontSize={7}
                fill={isCurrent ? '#000' : '#fff'} fontWeight="bold">{stepIdx+1}</text>
            )}
            {isDone && (
              <text x={z.x+z.w-7} y={z.y+10} textAnchor="middle" fontSize={9}>✓</text>
            )}
          </g>
        );
      })}

      {/* Route polyline */}
      {routePoints && (
        <polyline points={routePoints} fill="none"
          stroke="#ffd700" strokeWidth={1.5} strokeDasharray="4 3" opacity={0.5}/>
      )}

      {/* Entrance dot */}
      <circle cx={ENT.cx} cy={ENT.cy} r={5} fill="#007934" stroke="#ffd700" strokeWidth={1.5}/>
      <text x={ENT.cx} y={ENT.cy+4} textAnchor="middle" fontSize={7} fill="#ffd700">🏠</text>

      {/* User dot with smooth transition */}
      <g style={{
        transform:`translate(${userPos.x}px,${userPos.y}px)`,
        transition: moving ? 'transform 0.35s linear' : 'none',
      }}>
        {/* Pulse ring when moving */}
        {moving && (
          <circle r={14} fill="none" stroke="#007934" strokeWidth={1.5} opacity={0.4}
            style={{animation:'walk-pulse 0.7s ease-in-out infinite'}}/>
        )}
        <circle r={9} fill="#007934" stroke="#ffd700" strokeWidth={2}/>
        <text y={4} textAnchor="middle" fontSize={10}>🧑</text>
      </g>
    </svg>
  );
}

/* ══════════════════════════════════════════════════════
   PRODUCT PICKER COMPONENT
══════════════════════════════════════════════════════ */
function ProductPicker({ selected, onChange }) {
  const [search, setSearch] = useState('');
  const [filterZone, setFilterZone] = useState('all');

  const zones = useMemo(() => [
    {id:'all', name:'ทั้งหมด', icon:'🏪'},
    ...Object.entries(ZONE_DEFS).map(([id, z]) => ({id, name:z.name, icon:z.icon}))
  ], []);

  const filtered = useMemo(() => CATALOG.filter(p => {
    const matchZone = filterZone === 'all' || p.zone === filterZone;
    const matchSearch = !search || p.name.includes(search);
    return matchZone && matchSearch;
  }), [search, filterZone]);

  const toggle = (id) => {
    onChange(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  };

  return (
    <div className="flex flex-col gap-3">
      {/* Search */}
      <input
        value={search} onChange={e => setSearch(e.target.value)}
        placeholder="🔍 ค้นหาสินค้า..."
        className="w-full px-3 py-2 rounded-xl text-sm outline-none"
        style={{background:'#0d2010', border:'1px solid #1e4025', color:'#e2e8f0'}}
      />
      {/* Zone filter */}
      <div className="flex gap-1.5 overflow-x-auto pb-1">
        {zones.map(z => (
          <button key={z.id} onClick={() => setFilterZone(z.id)}
            className="flex-shrink-0 px-2 py-1 rounded-full text-xs font-semibold transition-all"
            style={{
              background: filterZone === z.id ? '#007934' : '#0d2010',
              color: filterZone === z.id ? '#fff' : '#4ade80',
              border: `1px solid ${filterZone === z.id ? '#007934' : '#1e4025'}`,
            }}>
            {z.icon} {z.name}
          </button>
        ))}
      </div>
      {/* Product grid */}
      <div className="grid grid-cols-2 gap-2 overflow-y-auto" style={{maxHeight:300}}>
        {filtered.map(p => {
          const z = ZONE_DEFS[p.zone];
          const isSel = selected.includes(p.id);
          const saving = p.orig - p.price;
          return (
            <button key={p.id} onClick={() => toggle(p.id)}
              className="flex flex-col gap-1 p-2 rounded-xl text-left transition-all"
              style={{
                background: isSel ? '#071a07' : '#0a160a',
                border: `1.5px solid ${isSel ? '#ffd700' : '#1e4025'}`,
              }}>
              <div className="flex items-center gap-1">
                <span className="text-lg">{z.icon}</span>
                <span className="text-xs font-semibold flex-1" style={{color:z.tc}}>{p.name}</span>
                {isSel && <span className="text-yellow-400 text-xs">✓</span>}
              </div>
              <div className="flex items-center justify-between">
                <span className="text-green-400 text-sm font-bold">฿{p.price}</span>
                {saving > 0 && <span className="text-xs text-red-400 line-through">฿{p.orig}</span>}
              </div>
              {saving > 0 && (
                <span className="text-xs font-bold" style={{color:'#ffd700'}}>ประหยัด ฿{saving}</span>
              )}
            </button>
          );
        })}
        {!filtered.length && (
          <div className="col-span-2 text-center text-gray-500 py-8">ไม่พบสินค้า</div>
        )}
      </div>
      <p className="text-center text-xs text-gray-400">
        เลือกแล้ว {selected.length} รายการ
        {selected.length > 0 && ` • ประหยัด ฿${CATALOG.filter(p=>selected.includes(p.id)).reduce((s,p)=>s+(p.orig-p.price),0)}`}
      </p>
    </div>
  );
}

      list.push({ name:'คุณ ⭐', savings: userSavings, month:'มี.ค.' });

    return list.sort((a,b) => b.savings - a.savings).slice(0, 7);

  const medalColor = ['#ffd700','#c0c0c0','#cd7f32'];

  return (
    <div className="flex flex-col gap-3">
      <div className="text-center">
        <div className="text-2xl mb-1">🏆</div>
        <h3 className="text-yellow-400 font-bold text-base">The Deal Hunter</h3>
        <p className="text-gray-400 text-xs">อันดับประหยัดสูงสุดประจำเดือน มี.ค.</p>
      </div>
      {/* Top 3 rewards */}
      <div className="grid grid-cols-3 gap-2">
        {RANK_REWARDS.map((r,i) => (
          <div key={i} className="text-center p-2 rounded-xl"
            style={{background:'#071207', border:`1px solid ${medalColor[i]}`}}>
            <div className="text-lg">{['🥇','🥈','🥉'][i]}</div>
            <div className="text-xs font-bold" style={{color:medalColor[i]}}>{r}</div>
          </div>
        ))}
      </div>
      {/* Rankings */}
      <div className="flex flex-col gap-1.5">
        {board.map((u, i) => {
          const isUser = u.name === 'คุณ ⭐';
          return (
            <div key={i} className="flex items-center gap-3 px-3 py-2 rounded-xl"
              style={{
                background: isUser ? '#071a07' : '#0a160a',
                border:`1px solid ${isUser ? '#ffd700' : i < 3 ? medalColor[i]+'44' : '#1e4025'}`,
              }}>
              <span className="text-lg w-6 text-center">{i < 3 ? ['🥇','🥈','🥉'][i] : `${i+1}.`}</span>
              <span className="flex-1 text-sm font-semibold" style={{color:isUser?'#ffd700':'#e2e8f0'}}>
                {u.name}
              </span>
              <span className="text-green-400 font-bold text-sm">฿{u.savings.toLocaleString()}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════
   MAIN APP
══════════════════════════════════════════════════════ */
function App() {
  const [screen, setScreen] = useState('home'); // home|pick|route|catch|done|board
  const [selectedIds, setSelectedIds] = useState([]);
  const [waypoints, setWaypoints] = useState([]);
  const [walkStep, setWalkStep] = useState(-1); // -1 = at entrance
  const [userPos, setUserPos] = useState({ x: ENT.cx, y: ENT.cy });
  const [moving, setMoving] = useState(false);
  const [collected, setCollected] = useState([]);
  const [lives, setLives] = useState(3);
  const [catchTarget, setCatchTarget] = useState(null);
  const [totalSavings, setTotalSavings] = useState(0);
  const [totalCal, setTotalCal] = useState(0);
  const timerRef = useRef(null);

  // Selected product objects
  const selProducts = useMemo(() => CATALOG.filter(p => selectedIds.includes(p.id)), [selectedIds]);

  // Build waypoints from selected products
  const buildWaypoints = useCallback(() => {
    const byZone = {};
    selProducts.forEach(p => {
      if (!byZone[p.zone]) byZone[p.zone] = [];
      byZone[p.zone].push(p);
    });
    const zoneIds = Object.keys(byZone);
    const ordered = tspOrder(zoneIds);
    return ordered.map(zone => ({ zone, items: byZone[zone] }));
  }, [selProducts]);

  const handleStartRoute = () => {
    if (!selProducts.length) return;
    const wps = buildWaypoints();
    setWaypoints(wps);
    setWalkStep(-1);
    setUserPos({ x: ENT.cx, y: ENT.cy });
    setCollected([]);
    setLives(3);
    setTotalSavings(0);
    setTotalCal(0);
    setScreen('route');
  };

  // Smooth step-by-step animation
  const animatePath = useCallback((pts, onDone) => {
    let i = 1;
    const step = () => {
      if (i < pts.length) {
        setUserPos({ x: pts[i][0], y: pts[i][1] });
        i++;
        timerRef.current = setTimeout(step, 380);
      } else {
        onDone();
      }
    };
    step();
  }, []);

  const handleWalk = () => {
    if (moving) return;
    const next = walkStep + 1;
    if (next >= waypoints.length) return;
    setMoving(true);
    const fromId = walkStep < 0 ? 'entrance' : waypoints[walkStep].zone;
    const toId   = waypoints[next].zone;
    const pts    = aisleRoute(fromId, toId);
    animatePath(pts, () => {
      setMoving(false);
      setWalkStep(next);
      // Show catch screen
      const wp = waypoints[next];
      const item = wp.items[0];
      const z = ZONE_DEFS[wp.zone];
      setCatchTarget({ ...item, icon: z.icon, stepIdx: next });
      setScreen('catch');
    });
  };

  const handleCatchSuccess = () => {
    const wp = waypoints[catchTarget.stepIdx];
    const savings = wp.items.reduce((s, p) => s + (p.orig - p.price), 0);
    const cals    = wp.items.reduce((s, p) => s + p.cal, 0);
    setTotalSavings(prev => prev + savings);
    setTotalCal(prev => prev + cals);
    setCollected(c => [...c, catchTarget.stepIdx]);
    setCatchTarget(null);
    if (catchTarget.stepIdx >= waypoints.length - 1) {
      setScreen('done');
    } else {
      setScreen('route');
    }
  };

  const handleCatchFail = () => {
    setCollected(c => [...c, catchTarget.stepIdx]);
    setCatchTarget(null);
    if (catchTarget.stepIdx >= waypoints.length - 1) {
      setScreen('done');
    } else {
      setScreen('route');
    }
  };

  useEffect(() => () => { if (timerRef.current) clearTimeout(timerRef.current); }, []);

  // ── HOME ──
  if (screen === 'home') return (
    <div className="min-h-screen flex flex-col items-center justify-center px-4 gap-6"
      style={{background:'linear-gradient(160deg,#050f07 0%,#071a07 100%)'}}>
      <div className="text-center">
        <div className="text-6xl mb-3 ani-float">🛒</div>
        <h1 className="text-4xl font-black" style={{color:'#007934'}}>RouteDee</h1>
        <p className="text-yellow-400 font-semibold text-lg mt-1">Smart Shopping Navigator</p>
        <p className="text-gray-400 text-sm mt-2">เดินฉลาด • ซื้อคุ้ม • ประหยัดเวลา</p>
      </div>
      <div className="flex flex-col gap-3 w-full max-w-xs">
        <button onClick={() => setScreen('pick')}
          className="w-full py-4 rounded-2xl text-lg font-bold transition-all active:scale-95"
          style={{background:'#007934', color:'#fff', boxShadow:'0 4px 20px #007934aa'}}>
          🗺️ เริ่มวางแผนช็อปปิ้ง
        </button>
        <button onClick={() => setScreen('board')}
          className="w-full py-3 rounded-2xl text-base font-bold transition-all active:scale-95"
          style={{background:'#0d2010', color:'#ffd700', border:'1.5px solid #ffd70066'}}>
          🏆 The Deal Hunter Ranking
        </button>
      </div>
      <div className="grid grid-cols-3 gap-3 w-full max-w-xs mt-2">
        {[['⚡','เส้นทางสั้นสุด'],['💰','ดูส่วนลด'],['🔥','เก็บคะแนน']].map(([i,l])=>(
          <div key={l} className="flex flex-col items-center gap-1 p-3 rounded-xl"
            style={{background:'#071207', border:'1px solid #1e4025'}}>
            <span className="text-2xl">{i}</span>
            <span className="text-xs text-green-400 text-center font-semibold">{l}</span>
          </div>
        ))}
      </div>
    </div>
  );

  // ── PICK PRODUCTS ──
  if (screen === 'pick') return (
    <div className="min-h-screen flex flex-col px-4 py-5 gap-4"
      style={{background:'#050f07'}}>
      <div className="flex items-center gap-3">
        <button onClick={() => setScreen('home')} className="text-gray-400 text-xl">←</button>
        <div>
          <h2 className="text-lg font-bold text-green-400">เลือกสินค้า</h2>
          <p className="text-xs text-gray-500">{CATALOG.length} รายการ ใน 12 หมวดหมู่</p>
        </div>
      </div>
      <ProductPicker selected={selectedIds} onChange={setSelectedIds}/>
      <button
        onClick={handleStartRoute}
        disabled={!selectedIds.length}
        className="w-full py-4 rounded-2xl text-lg font-bold transition-all active:scale-95"
        style={{
          background: selectedIds.length ? '#007934' : '#1a2e1a',
          color: selectedIds.length ? '#fff' : '#4a6a4a',
        }}>
        {selectedIds.length ? `🗺️ คำนวณเส้นทาง (${selectedIds.length} รายการ)` : 'เลือกสินค้าก่อน'}
      </button>
    </div>
  );

  // ── ROUTE MAP ──
  if (screen === 'route') {
    const nextStep = walkStep + 1;
    const nextWP = nextStep < waypoints.length ? waypoints[nextStep] : null;
    const isLast = nextStep >= waypoints.length - 1;
    const progressPct = waypoints.length ? Math.round((collected.length / waypoints.length) * 100) : 0;

    return (
      <div className="min-h-screen flex flex-col px-3 py-4 gap-3" style={{background:'#050f07'}}>
        {/* Header */}
        <div className="flex items-center justify-between">
          <button onClick={() => setScreen('pick')} className="text-gray-400">← แก้ไข</button>
          <div className="text-center">
            <div className="text-xs text-gray-400">ความคืบหน้า</div>
            <div className="text-sm font-bold text-green-400">{collected.length}/{waypoints.length} โซน</div>
          </div>
          <div className="flex gap-1">
            {[0,1,2].map(i=>(
              <span key={i} style={{fontSize:16, opacity:i<lives?1:0.2}}>❤️</span>
            ))}
          </div>
        </div>

        {/* Progress bar */}
        <div className="w-full h-2 rounded-full" style={{background:'#0d2010'}}>
          <div className="h-full rounded-full transition-all duration-500"
            style={{width:`${progressPct}%`, background:'linear-gradient(90deg,#007934,#ffd700)'}}/>
        </div>

        {/* Store map */}
        <div className="rounded-2xl overflow-hidden" style={{border:'1px solid #1e4025', background:'#0a1a0a'}}>
          <StoreMap waypoints={waypoints} walkStep={walkStep} userPos={userPos}
            moving={moving} collected={collected}/>
        </div>

        {/* Next destination info */}
        {nextWP && (
          <div className="flex items-center gap-3 px-4 py-3 rounded-2xl"
            style={{background:'#071207', border:'1px solid #1e4025'}}>
            <span className="text-2xl">{ZONE_DEFS[nextWP.zone].icon}</span>
            <div className="flex-1">
              <div className="text-sm font-bold text-green-300">
                จุดถัดไป: {ZONE_DEFS[nextWP.zone].name}
              </div>
              <div className="text-xs text-gray-400">
                {nextWP.items.map(p=>p.name).join(', ')}
              </div>
            </div>
            <div className="text-right">
              <div className="text-yellow-400 font-bold text-sm">
                ฿{nextWP.items.reduce((s,p)=>s+(p.orig-p.price),0)}
              </div>
              <div className="text-xs text-gray-500">ประหยัด</div>
            </div>
          </div>
        )}

        {/* Walk button */}
        <button
          onClick={handleWalk}
          disabled={moving || nextStep >= waypoints.length}
          className="w-full py-4 rounded-2xl text-lg font-bold transition-all active:scale-95"
          style={{
            background: moving ? '#1a2e1a' : nextStep >= waypoints.length ? '#1a2e1a' : '#007934',
            color: moving || nextStep >= waypoints.length ? '#4a6a4a' : '#fff',
            boxShadow: moving || nextStep >= waypoints.length ? 'none' : '0 4px 20px #007934aa',
          }}>
          {moving ? '🚶 กำลังเดิน...' :
           nextStep >= waypoints.length ? '✅ ครบทุกโซนแล้ว!' :
           `🚶 เดินไป ${ZONE_DEFS[nextWP?.zone]?.name} (${nextStep+1}/${waypoints.length})`}
        </button>
        {nextStep >= waypoints.length && (
          <button onClick={() => setScreen('done')}
            className="w-full py-3 rounded-2xl text-base font-bold"
            style={{background:'#ffd700', color:'#000'}}>
            🏁 ดูสรุปการช็อปปิ้ง
          </button>
        )}
      </div>
    );
  }

  // ── MONSTER CATCH ──
  if (screen === 'catch' && catchTarget) {
    const wp = waypoints[catchTarget.stepIdx];
    return (
      <div className="min-h-screen flex flex-col items-center px-4 py-6 gap-4"
        style={{background:'#050f07'}}>
        <div className="text-center">
          <div className="text-sm text-gray-400">โซน: {ZONE_DEFS[wp.zone].name}</div>
          <h2 className="text-xl font-bold text-green-300 mt-1">จับสินค้า!</h2>
        </div>
        <div className="flex gap-1">
          {[0,1,2].map(i=>(
            <span key={i} style={{fontSize:22, opacity:i<lives?1:0.2, transition:'opacity 0.3s'}}>❤️</span>
          ))}
        </div>
        <MonsterCatch
          product={{...catchTarget, icon: catchTarget.icon}}
          onSuccess={handleCatchSuccess}
          onFail={handleCatchFail}
          onLiveLost={() => setLives(l => Math.max(0, l-1))}
        />
        {/* Items in this zone */}
        <div className="w-full max-w-xs">
          {wp.items.map(p => (
            <div key={p.id} className="flex items-center justify-between px-3 py-2 rounded-xl mb-1.5"
              style={{background:'#071207', border:'1px solid #1e4025'}}>
              <span className="text-sm text-green-200">{p.name}</span>
              <div className="flex items-center gap-2">
                <span className="text-xs text-gray-500 line-through">฿{p.orig}</span>
                <span className="text-yellow-400 font-bold text-sm">฿{p.price}</span>
              </div>
            </div>
          ))}
        </div>
        <button onClick={handleCatchFail} className="text-gray-500 text-xs">ข้ามไปก่อน →</button>
      </div>
    );
  }

  // ── DONE ──
  if (screen === 'done') {
    const steps = Math.round(totalCal * 1.3 * 10);
    return (
      <div className="min-h-screen flex flex-col items-center px-4 py-8 gap-6"
        style={{background:'#050f07'}}>
        <div className="text-center ani-bounce-in">
          <div className="text-6xl mb-3">🎉</div>
          <h2 className="text-2xl font-black text-yellow-400">ช็อปเสร็จแล้ว!</h2>
        </div>
        <div className="grid grid-cols-2 gap-3 w-full max-w-xs">
          {[
            {icon:'💰', label:'ประหยัดรวม', value:`฿${totalSavings}`, color:'#ffd700'},
            {icon:'🔥', label:'แคลอรี่ที่ได้', value:`${totalCal} cal`, color:'#f97316'},
            {icon:'👣', label:'ก้าวโดยประมาณ', value:steps.toLocaleString(), color:'#4ade80'},
            {icon:'✅', label:'สินค้าที่ได้', value:`${selProducts.length} ชิ้น`, color:'#93c5fd'},
          ].map(({icon,label,value,color})=>(
            <div key={label} className="flex flex-col items-center gap-1 p-4 rounded-2xl ani-calorie"
              style={{background:'#071207', border:`1px solid ${color}44`}}>
              <span className="text-2xl">{icon}</span>
              <span className="text-xs text-gray-400">{label}</span>
              <span className="text-lg font-black" style={{color}}>{value}</span>
            </div>
          ))}
        </div>
        <div className="flex flex-col gap-2 w-full max-w-xs">
          <button onClick={() => setScreen('board')}
            className="w-full py-3 rounded-2xl font-bold"
            style={{background:'#ffd700', color:'#000'}}>
            🏆 ดูอันดับ Deal Hunter
          </button>
          <button onClick={() => { setScreen('home'); setSelectedIds([]); }}
            className="w-full py-3 rounded-2xl font-bold"
            style={{background:'#0d2010', color:'#4ade80', border:'1px solid #1e4025'}}>
            🛒 ช็อปใหม่อีกครั้ง
          </button>
        </div>
      </div>
    );
  }

  // ── LEADERBOARD ──
  if (screen === 'board') return (
    <div className="min-h-screen flex flex-col px-4 py-5 gap-4" style={{background:'#050f07'}}>
      <div className="flex items-center gap-3">
        <button onClick={() => setScreen('home')} className="text-gray-400 text-xl">←</button>
        <h2 className="text-lg font-bold text-yellow-400">The Deal Hunter</h2>
      </div>
      <Leaderboard userSavings={totalSavings}/>
      <button onClick={() => setScreen('home')}
        className="w-full py-3 rounded-2xl font-bold mt-2"
        style={{background:'#007934', color:'#fff'}}>
        🏠 กลับหน้าหลัก
      </button>
    </div>
  );

  return null;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
