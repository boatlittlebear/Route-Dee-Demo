  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800;900&display=swap');
    *, body { font-family: 'Kanit', sans-serif; box-sizing: border-box; }

    @keyframes float      { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes bounce-in  { 0%{transform:scale(.3) rotate(-8deg);opacity:0} 65%{transform:scale(1.12) rotate(2deg);opacity:1} 100%{transform:scale(1) rotate(0)} }
    @keyframes shake      { 0%,100%{transform:translateX(0) rotate(0)} 20%{transform:translateX(-7px) rotate(-4deg)} 40%{transform:translateX(7px) rotate(4deg)} 60%{transform:translateX(-4px) rotate(-2deg)} 80%{transform:translateX(4px) rotate(2deg)} }
    @keyframes slide-up   { from{transform:translateY(16px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes num-glow   { 0%,100%{text-shadow:0 0 6px currentColor} 50%{text-shadow:0 0 22px currentColor,0 0 44px currentColor} }
    @keyframes draw-line  { from{stroke-dashoffset:800} to{stroke-dashoffset:0} }
    @keyframes pop-item   { 0%{transform:scale(0);opacity:0} 70%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
    @keyframes calorie-in { 0%{transform:scale(0) rotate(-15deg);opacity:0} 80%{transform:scale(1.1) rotate(2deg)} 100%{transform:scale(1) rotate(0);opacity:1} }
    @keyframes step-flash { 0%,100%{background:rgba(5,150,105,.15)} 50%{background:rgba(5,150,105,.4)} }
    @keyframes tag-in     { 0%{transform:scale(0);opacity:0} 100%{transform:scale(1);opacity:1} }

    .ani-float     { animation: float 2.5s ease-in-out infinite }
    .ani-bounce-in { animation: bounce-in .5s cubic-bezier(.34,1.56,.64,1) forwards }
    .ani-shake     { animation: shake .38s ease-in-out infinite }
    .ani-slide-up  { animation: slide-up .4s ease-out forwards }
    .ani-num-glow  { animation: num-glow 2s ease-in-out infinite }
    .ani-draw      { stroke-dasharray:800; animation: draw-line 1.5s ease-out forwards }
    .ani-pop-item  { animation: pop-item .45s cubic-bezier(.34,1.56,.64,1) forwards }
    .ani-calorie   { animation: calorie-in .6s cubic-bezier(.34,1.56,.64,1) forwards }
    .ani-step-flash{ animation: step-flash 1.2s ease-in-out infinite }
    .ani-tag-in    { animation: tag-in .25s cubic-bezier(.34,1.56,.64,1) forwards }

/* สร้าง waypoints จากสินค้าที่เลือก (group by zone, order by ZONE_ORDER) */
const buildWaypoints = (selectedIds) => {
  const byZone = {};
  CATALOG.filter(p => selectedIds.has(p.id)).forEach(p => {
    (byZone[p.zone] = byZone[p.zone]||[]).push(p);
  });
  return ZONE_ORDER
    .filter(z => byZone[z])
    .map((z, i) => ({
      label: LABELS[i],
      zone: z,
      items: byZone[z],
      x: ZONE_CFG[z].x,
      y: ZONE_CFG[z].y,
      dist: ZONE_CFG[z].dist,
      monster: ZONE_CFG[z].monster,
    }));
};

/* ════════════════════════════════════════════
   SVG LINE CHART
════════════════════════════════════════════ */
const LineChart = ({ data, days }) => {
  const W=240,H=110,pad={t:10,r:10,b:24,l:30};
  const iW=W-pad.l-pad.r, iH=H-pad.t-pad.b, max=Math.max(...data);
  const pts = data.map((v,i)=>({ x:pad.l+i*(iW/(data.length-1)), y:pad.t+iH-(v/max)*iH }));
  const polyPts = pts.map(p=>`${p.x},${p.y}`).join(' ');
  const area = `${pts[0].x},${pad.t+iH} ${polyPts} ${pts[pts.length-1].x},${pad.t+iH}`;
  return (
    <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`}>
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#10b981" stopOpacity=".4"/>
          <stop offset="100%" stopColor="#10b981" stopOpacity="0"/>
        </linearGradient>
      </defs>
      {[0,.25,.5,.75,1].map((r,i)=><line key={i} x1={pad.l} y1={pad.t+iH*r} x2={pad.l+iW} y2={pad.t+iH*r} stroke="#1e3a5f" strokeWidth="1" strokeDasharray="3,3"/>)}
      {[0,.5,1].map((r,i)=><text key={i} x={pad.l-4} y={pad.t+iH*(1-r)+4} textAnchor="end" fill="#64748b" fontSize="9">{Math.round(max*r)}</text>)}
      <polygon points={area} fill="url(#lg)"/>
      <polyline points={polyPts} fill="none" stroke="#10b981" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="ani-draw"/>
      {pts.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r="4" fill="#10b981" stroke="#0f172a" strokeWidth="1.5"/>)}
      {days.map((d,i)=><text key={i} x={pts[i].x} y={H-6} textAnchor="middle" fill="#64748b" fontSize="9">{d}</text>)}
    </svg>
  );
};

/* ════════════════════════════════════════════
   ANIMATED STORE MAP (accepts dynamic waypoints)
════════════════════════════════════════════ */

      <rect x="116" y="16" width="88" height="78" rx="6" fill="#2e1065" stroke="#6d28d9" strokeWidth="1.5"/>

      <rect x="16" y="148" width="88" height="78" rx="6" fill="#172554" stroke="#1d4ed8" strokeWidth="1.5"/>
      <text x="60" y="184" textAnchor="middle" fill="#60a5fa" fontSize="9" fontWeight="600">🥤 เครื่องดื่ม</text>
      <rect x="116" y="148" width="88" height="78" rx="6" fill="#431407" stroke="#9a3412" strokeWidth="1.5"/>
      <text x="160" y="184" textAnchor="middle" fill="#fb923c" fontSize="9" fontWeight="600">🧴 เครื่องใช้</text>
      <rect x="218" y="16" width="66" height="210" rx="6" fill="#1c1c07" stroke="#713f12" strokeWidth="1.5"/>
      <text x="251" y="115" textAnchor="middle" fill="#d4a96a" fontSize="9" fontWeight="600">🍞 เบเกอรี่</text>

      {/* aisles */}
      <line x1="108" y1="16" x2="108" y2="226" stroke="#1e3a5f" strokeWidth="1.5" strokeDasharray="5,4"/>
      <line x1="16" y1="134" x2="214" y2="134" stroke="#1e3a5f" strokeWidth="1.5" strokeDasharray="5,4"/>

      {/* full route (dim) */}
      {waypoints.length > 1 && (
        <polyline
          points={[START, ...waypoints].map(p=>`${p.x},${p.y}`).join(' ')}
          fill="none" stroke="#22d3ee" strokeWidth="1.5" strokeDasharray="6,5" opacity=".18"/>
      )}

      {/* completed segments */}
      {waypoints.map((wp, i) => {
        if (i > stepIdx) return null;
        const from = i === 0 ? START : waypoints[i-1];
        return (
          <line key={i} x1={from.x} y1={from.y} x2={wp.x} y2={wp.y}
            stroke="#22d3ee" strokeWidth="2.5" opacity=".8" className="ani-draw"/>
        );
      })}

      {/* waypoint pins */}
      {waypoints.map((wp, i) => {
        const done   = collected.includes(i);
        const active = i === stepIdx;
        return (
          <g key={i}>
            {active && (
              <circle cx={wp.x} cy={wp.y} r="18" fill="rgba(34,211,238,.12)">
                <animate attributeName="r" values="14;22;14" dur="1.5s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values=".5;.1;.5" dur="1.5s" repeatCount="indefinite"/>

              strokeWidth="1.5"/>
            <text x={wp.x} y={wp.y+4} textAnchor="middle" fontSize="11">

            <text x={wp.x} y={wp.y-18} textAnchor="middle" fill="#94a3b8" fontSize="8" fontWeight="700">
              {wp.label}

            {/* item count badge if multiple */}
            {wp.items.length > 1 && (
              <>
                <circle cx={wp.x+12} cy={wp.y-10} r="6" fill="#ef4444" stroke="#0f172a" strokeWidth="1"/>
                <text x={wp.x+12} y={wp.y-6} textAnchor="middle" fill="white" fontSize="7" fontWeight="700">
                  {wp.items.length}
                </text>
              </>
            )}
            {/* monster glow */}
            {wp.monster && !done && (
              <>
                <circle cx={wp.x+17} cy={wp.y-15} r="9" fill="rgba(255,215,0,.1)">
                  <animate attributeName="r" values="6;13;6" dur="2s" repeatCount="indefinite"/>
                  <animate attributeName="opacity" values=".5;.1;.5" dur="2s" repeatCount="indefinite"/>
                </circle>
                <circle cx={wp.x+17} cy={wp.y-15} r="7" fill="rgba(255,215,0,.8)" stroke="#ffd700" strokeWidth="1.5">

                </circle>
                <text x={wp.x+17} y={wp.y-11} textAnchor="middle" fontSize="8">{wp.monster.emoji}</text>
              </>
            )}
          </g>
        );
      })}

      {/* user dot */}
      <g style={{
        transform:`translate(${currentPos.x}px,${currentPos.y}px)`,
        transition: moving ? 'transform 1.4s cubic-bezier(.4,0,.2,1)' : 'none'
      }}>
        <circle r="11" fill="#3b82f6" stroke="white" strokeWidth="2.5">
          {moving
            ? <animate attributeName="r" values="9;12;9" dur=".6s" repeatCount="indefinite"/>
            : <animate attributeName="opacity" values="1;.4;1" dur="1.2s" repeatCount="indefinite"/>
          }
        </circle>
        <text y="4" textAnchor="middle" fontSize="10">🧑</text>
      </g>

/* ════════════════════════════════════════════
   WALKING NAVIGATOR
════════════════════════════════════════════ */
const WalkNavigator = ({ waypoints, stepIdx, moving, collected, coupons, onWalk, onMonsterEncounter, onFinish, onBack }) => {
  const atWP      = stepIdx >= 0 && stepIdx < waypoints.length;
  const wp        = atWP ? waypoints[stepIdx] : null;
  const hasMonster = wp && wp.monster && !coupons.find(c=>c.id===wp.monster.id);
  const allDone   = collected.length === waypoints.length;
  const distSoFar = waypoints.slice(0, collected.length).reduce((a,w)=>a+w.dist,0);

  return (
    <div className="h-full overflow-y-auto p-3" style={{background:'#080c1a'}}>
      {/* header */}
      <div className="flex items-center justify-between mb-2">
        <button onClick={onBack} className="text-slate-500 text-xs underline">← แก้รายการ</button>
        <div className="text-xs text-cyan-300 font-semibold">{collected.length}/{waypoints.length} รายการ</div>
      </div>

      {/* step trail */}
      <div className="flex items-center gap-1 mb-3">
        <div className="text-gray-600 text-xs shrink-0">START</div>
        {waypoints.map((w,i) => (
          <React.Fragment key={i}>
            <div className="h-px flex-1 min-w-0 transition-all"
              style={{background:collected.includes(i)?'#22d3ee':'#1e3a5f'}}/>
            <div className={`w-7 h-7 rounded-full shrink-0 flex items-center justify-center text-sm
              border transition-all
              ${collected.includes(i)?'border-emerald-400 bg-emerald-900/50':
                i===stepIdx+1?'border-cyan-500 bg-cyan-900/30 ani-step-flash':
                'border-slate-700 bg-slate-900'}`}>
              {collected.includes(i) ? '✅' : w.items[0].emoji}
            </div>
          </React.Fragment>
        ))}
      </div>

      {/* map */}
      <StoreMap waypoints={waypoints} stepIdx={stepIdx} moving={moving} collected={collected}/>

      {/* status */}
      <div className="mt-2.5 space-y-2">
        {stepIdx < 0 && !moving && (
          <button onClick={onWalk}
            className="w-full py-3.5 rounded-2xl font-bold text-white text-base"
            style={{background:'linear-gradient(135deg,#059669,#0891b2)',boxShadow:'0 4px 18px rgba(5,150,105,.35)'}}>
            🚶 เริ่มเดินช้อป!
          </button>
        )}

        {moving && (
          <div className="rounded-2xl p-3 border border-cyan-700/50 text-center ani-step-flash"
            style={{background:'rgba(8,145,178,.08)'}}>
            <div className="text-cyan-300 font-bold text-sm">🚶 กำลังเดินไปจุด {waypoints[stepIdx]?.label}…</div>
          </div>
        )}

        {!moving && atWP && (
          <div className="ani-pop-item space-y-2">
            {/* arrived card */}
            <div className="rounded-2xl p-3 border border-emerald-600/40"
              style={{background:'linear-gradient(135deg,rgba(5,78,22,.5),rgba(3,52,44,.5))'}}>
              <div className="flex items-start gap-2">
                <div>
                  <div className="text-emerald-300 text-xs font-semibold">✅ ถึงแล้ว — Zone {wp.zone}</div>
                  <div className="text-white font-bold text-sm mt-0.5">
                    {wp.items.map(p => `${p.emoji} ${p.name}`).join('  ·  ')}
                  </div>
                  {wp.items.length > 1 && (
                    <div className="text-emerald-400 text-xs mt-0.5">เก็บครั้งเดียวได้ {wp.items.length} ชิ้น!</div>
                  )}
                </div>
                <div className="ml-auto text-cyan-300 text-xs shrink-0">+{wp.dist}m</div>
              </div>
            </div>

            {/* monster */}
            {hasMonster && (
              <button onClick={onMonsterEncounter}
                className="w-full py-3 rounded-2xl font-bold text-white text-sm"
                style={{
                  background:'linear-gradient(135deg,#6d28d9,#db2777)',
                  boxShadow:'0 0 18px rgba(109,40,217,.4)',
                  animation:'float 2s ease-in-out infinite',
                }}>
                ⚡ ปีศาจ{wp.monster.rarity}โผล่แล้ว! {wp.monster.emoji} กดเพื่อจับ!
              </button>
            )}

            {!allDone ? (
              <button onClick={onWalk}
                className="w-full py-3 rounded-2xl font-bold text-white text-sm"
                style={{background:'linear-gradient(135deg,#0891b2,#1d4ed8)'}}>

              <div className="text-gray-600 text-xs">{s.label}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

/* ════════════════════════════════════════════
   MONSTER CATCH (with retry)
════════════════════════════════════════════ */
const MonsterCatch = ({ monster, lives, onCaught, onEscape, onLiveLost }) => {
  const [phase, setPhase] = useState('encounter');
  const [attempts, setAttempts] = useState(0);

  const handleThrow = () => {
    setPhase('throwing');
    setTimeout(() => {
      const ok = Math.random() > 0.45;
      setPhase(ok ? 'success' : 'fail');
      if (ok) {
        setTimeout(() => onCaught(monster), 600);
      } else {
        setAttempts(a => a+1);
        onLiveLost();
      }
    }, 1100);
  };

  return (
    <div className="h-full flex flex-col items-center justify-center p-5"
      style={{background:'linear-gradient(160deg,#12002e,#0d1a4a)'}}>
      {phase !== 'success' && (
        <div className="w-full flex justify-between items-center mb-3">
          <div className="text-xs text-gray-500">
            ครั้งที่ {attempts+1}{attempts>0&&` (พลาด ${attempts}ครั้ง)`}
          </div>
          <div className="text-base leading-none">
            {'❤️'.repeat(lives)}{'🖤'.repeat(5-lives)}
          </div>
        </div>
      )}

      {phase !== 'success' && (
        <>
          <div className="text-yellow-400 text-xs font-bold rounded-full px-3 py-1.5 mb-3
            border border-yellow-500/50" style={{background:'rgba(120,60,0,.2)'}}>
            ⚡ พบปีศาจ{monster.rarity}!
          </div>
          <div className="text-8xl mb-2 ani-float"
            style={{filter:'drop-shadow(0 0 28px rgba(180,80,255,.85))',
              animation: phase==='fail' ? 'none' : undefined}}>
            {phase==='fail' ? '💨' : monster.emoji}
          </div>
          <div className="font-bold text-sm mb-3" style={{color:monster.rc}}>⭐ {monster.rarity}</div>
          <div className="w-full rounded-2xl p-3 text-center mb-4 border border-purple-500/40"
            style={{background:'rgba(46,16,101,.55)'}}>
            <div className="text-white font-bold text-base">{monster.brand}</div>
            <div className="font-black text-3xl text-green-400">ลด ฿{monster.discount}</div>
          </div>
        </>
      )}

      {phase==='encounter' && (
        <>
          <button onClick={handleThrow}
            className="w-full py-4 rounded-2xl font-black text-white text-xl mb-2"
            style={{background:'linear-gradient(135deg,#7c3aed,#db2777)',boxShadow:'0 4px 24px rgba(124,58,237,.5)'}}>
            🎯 ขว้าง!
          </button>
          <button onClick={onEscape} className="text-slate-500 text-sm underline">หนีกลับ</button>
        </>
      )}

      {phase==='throwing' && (
        <div className="w-full py-4 rounded-2xl text-center bg-slate-700 text-white font-bold text-lg
          ani-shake">⚡ กำลังขว้าง…</div>
      )}

      {phase==='fail' && (
        <div className="w-full ani-bounce-in space-y-2">
          <div className="text-red-400 font-bold text-lg text-center">หลุดมือ! 😤 ❤️−1</div>
          <button onClick={()=>setPhase('encounter')}
            className="w-full py-3 rounded-xl text-white font-bold"
            style={{background:'linear-gradient(135deg,#7c3aed,#db2777)'}}>
            🎯 ลองอีกครั้ง!
          </button>
          <button onClick={onEscape}
            className="w-full py-2.5 rounded-xl text-red-300 font-semibold text-sm border border-red-800"
            style={{background:'rgba(127,29,29,.3)'}}>
            🏃 หนีเลย
          </button>
        </div>
      )}

      {phase==='success' && (
        <div className="text-center ani-bounce-in">
          <div className="text-7xl mb-2">🎉</div>
          <div className="text-green-400 font-black text-2xl mb-1">จับได้แล้ว!</div>
          <div className="text-green-300 font-bold text-xl">฿{monster.discount} เข้ากระเป๋า!</div>
        </div>
      )}
    </div>
  );
};

          </div>
        ))}
      </div>
    )}
  </div>
);

/* ════════════════════════════════════════════
   MAIN APP
════════════════════════════════════════════ */
const App = () => {
  const [view,       setView]       = useState('customer');
  const [screen,     setScreen]     = useState('list');
  const [activeTab,  setActiveTab]  = useState('home');
  const [lives,      setLives]      = useState(5);

  // product selection
  const [selected, setSelected] = useState(new Set([1,5,9,14,18])); // default 5 items

  // walking
  const [waypoints,  setWaypoints]  = useState([]);
  const [walkStep,   setWalkStep]   = useState(-1);
  const [moving,     setMoving]     = useState(false);
  const [collected,  setCollected]  = useState([]);

  // monster & coupons
  const [activeMonster, setActiveMonster] = useState(null);
  const [coupons,       setCoupons]       = useState([]);

  const toggleProduct = (id) => {
    setSelected(prev => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  };

  const handleStartShopping = () => {
    const wps = buildWaypoints(selected);
    setWaypoints(wps);
    setWalkStep(-1);
    setCollected([]);
    setMoving(false);
    setScreen('walking');
    setActiveTab('map');
  };

  const handleWalk = () => {
    const next = walkStep + 1;
    if (next >= waypoints.length) return;
    setMoving(true);
    setTimeout(() => {
      setMoving(false);
      setWalkStep(next);
      setCollected(c => c.includes(next) ? c : [...c, next]);
    }, 1600);
  };

  const handleMonsterEncounter = () => {
    const wp = waypoints[walkStep];
    if (wp?.monster) { setActiveMonster(wp.monster); setScreen('catch'); }
  };

  const handleCaught = (m) => {
    setCoupons(p => [...p, {...m, uid:Date.now()}]);
    setActiveMonster(null);
    setTimeout(() => setScreen('walking'), 700);
  };

  const goTab = (tab) => {
    setActiveTab(tab);
    if (tab==='home')   setScreen('list');
    if (tab==='map')    setScreen('walking');
    if (tab==='coupon') setScreen('wallet');
    if (tab==='rank')   setScreen('leaderboard');
  };

  return (
    <div className="min-h-screen flex flex-col items-center px-4 py-5" style={{background:'#030712'}}>

      {/* banner */}
      <div className="w-full max-w-5xl mb-4 text-center rounded-xl py-2 border border-slate-800"
        style={{background:'#0f172a'}}>
        <span className="text-slate-500 text-sm">🚀 Hackathon Demo — </span>
        <span className="text-cyan-400 font-bold text-sm">Retail AR Navigation</span>
        <span className="text-slate-500 text-sm"> · RouteDee</span>
      </div>

      {/* toggle */}
      <div className="flex gap-2 mb-6 p-1 rounded-2xl border border-slate-800" style={{background:'#0f172a'}}>
        {[
          {id:'customer',label:'📱 Customer App',   grad:'from-emerald-600 to-cyan-600'},
          {id:'brand',   label:'📊 Brand Dashboard',grad:'from-blue-700 to-indigo-700'},
        ].map(v=>(
          <button key={v.id} onClick={()=>setView(v.id)}
            className={`px-6 py-2 rounded-xl font-semibold text-sm transition-all
              ${view===v.id?`bg-gradient-to-r ${v.grad} text-white shadow-lg`:'text-slate-400 hover:text-white'}`}>
            {v.label}
          </button>
        ))}
      </div>

      {/* ── CUSTOMER ── */}
      {view==='customer' && (
        <div style={{width:360}}>
          <div className="rounded-[38px] border-4 border-slate-700 shadow-2xl overflow-hidden flex flex-col"
            style={{background:'#080c1a',height:680}}>

            {/* status bar */}
            <div className="flex justify-between items-center px-5 py-2 bg-black/60 shrink-0">
              <span className="text-white text-xs font-semibold">9:41</span>
              <div className="text-base leading-none">{'❤️'.repeat(lives)}{'🖤'.repeat(5-lives)}</div>
              <span className="text-white text-xs">📶 🔋</span>
            </div>

            {/* app header */}
            <div className="shrink-0 flex items-center justify-between px-4 py-2.5"
              style={{background:'linear-gradient(135deg,#065f46,#0e7490)'}}>
              <div>
                <div className="text-white font-black text-base leading-none">🛒 RouteDee</div>
                <div className="text-emerald-200 text-xs mt-0.5">{coupons.length} คูปองจับได้</div>
              </div>
              <div className="text-right">
                <div className="text-yellow-300 text-xs font-semibold">⏱ ชีวิตถัดไปใน 18:32</div>
                <div className="text-emerald-100 text-xs">{collected.length}/{waypoints.length||selected.size} รายการ</div>
              </div>
            </div>

            <div className="flex-1 overflow-hidden">
              {screen==='list' && (
                <ProductPicker selected={selected} onToggle={toggleProduct} onStart={handleStartShopping}/>
              )}
              {screen==='walking' && (
                <WalkNavigator
                  waypoints={waypoints} stepIdx={walkStep} moving={moving}
                  collected={collected} coupons={coupons}
                  onWalk={handleWalk}
                  onMonsterEncounter={handleMonsterEncounter}
                  onFinish={()=>setScreen('summary')}
                  onBack={()=>{setScreen('list');setActiveTab('home');}}
                />
              )}
              {screen==='catch' && activeMonster && (
                <MonsterCatch
                  monster={activeMonster} lives={lives}
                  onCaught={handleCaught}
                  onEscape={()=>{setActiveMonster(null);setScreen('walking');}}
                  onLiveLost={()=>setLives(l=>Math.max(0,l-1))}
                />
              )}
              {screen==='summary' && (
                <ShoppingSummary
                  waypoints={waypoints} collected={collected} coupons={coupons}
                  onViewCoupons={()=>{setScreen('wallet');setActiveTab('coupon');}}
                  onLeaderboard={()=>{setScreen('leaderboard');setActiveTab('rank');}}
                />
              )}
              {screen==='wallet' && (
                <CouponWallet coupons={coupons}
                  onGoHunt={()=>{setScreen('walking');setActiveTab('map');}}/>
              )}
              {screen==='leaderboard' && <Leaderboard/>}
            </div>

            {/* bottom nav */}
            <div className="shrink-0 border-t border-slate-800" style={{background:'#080c1a'}}>
              <div className="flex">
                {[
                  {id:'home',   icon:'🏠', label:'หน้าแรก'},
                  {id:'map',    icon:'🗺️', label:'แผนที่'},
                  {id:'coupon', icon:'🎫', label:'คูปอง', badge:coupons.length||null},
                  {id:'rank',   icon:'🏆', label:'อันดับ'},
                ].map(t=>(
                  <button key={t.id} onClick={()=>goTab(t.id)}
                    className={`flex-1 py-2.5 flex flex-col items-center relative transition-all
                      ${activeTab===t.id?'text-cyan-400':'text-slate-600'}`}>
                    <span className="text-xl leading-none">{t.icon}</span>
                    <span className="text-xs mt-0.5 leading-none">{t.label}</span>
                    {activeTab===t.id&&<div className="w-1.5 h-1.5 rounded-full bg-cyan-400 mt-0.5"/>}
                    {t.badge&&(
                      <span className="absolute top-1.5 right-3 text-xs bg-red-500 text-white
                        rounded-full w-4 h-4 flex items-center justify-center font-bold leading-none">
                        {t.badge}
                      </span>
                    )}
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ── BRAND ── */}
      {view==='brand' && (
        <div className="w-full max-w-5xl"><BrandDashboard/></div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
